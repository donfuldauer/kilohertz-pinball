# CodeRabbit is the only code reviewer (docs/PROCESS.md R9 and P6, D36).
#
# Review rhythm: GATE REVIEWS ONLY. CodeRabbit does not review routine unit-of-work PRs; they merge
# on green `pr-checks`, `main` CI and `work-verifier` (P5 unit gate). CodeRabbit reviews only at
# the completion of a phase or milestone, on a review-only "gate review" PR whose head is the gate
# issue's branch and whose base is `review-base/<gate>` (the last reviewed commit, recorded in
# docs/RUN_LOG.md), so the review covers every change merged since the previous gate
# (docs/PROCESS.md P6 "Gate reviews").
# The Orchestrator requests each pass explicitly with `@coderabbitai full review` (first pass) and
# `@coderabbitai review` (after fix pushes); nothing is reviewed automatically.
language: en-US
reviews:
  # Gate reviews are infrequent and cumulative, so report everything worth fixing.
  profile: chill
  # Approve once every comment is resolved (PROCESS.md P6 gate merge conditions).
  request_changes_workflow: true
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    # Off: routine PRs are never reviewed; gate review PRs are reviewed on explicit request.
    enabled: false
    drafts: false
    auto_incremental_review: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    # Gate review PRs target `review-base/<gate>` branches, not `main`.
    base_branches:
      - "^review-base/.*"
  # Skip files a reviewer cannot read or that are generated, vendored or recorded data.
  # Code, shaders, Lua/Wasm-text table rules, TOML manifests, CI and docs stay in review.
  path_filters:
    # Images and textures (including raw test-reference pixel dumps)
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.bmp"
    - "!**/*.tga"
    - "!**/*.ktx2"
    - "!**/*.dds"
    - "!**/*.hdr"
    - "!**/*.exr"
    - "!**/*.ico"
    - "!**/*.rgba8"
    # Audio
    - "!**/*.ogg"
    - "!**/*.wav"
    - "!**/*.mp3"
    - "!**/*.flac"
    # Fonts
    - "!**/*.ttf"
    - "!**/*.otf"
    - "!**/*.woff"
    - "!**/*.woff2"
    # 3D models and packaged tables
    - "!**/*.glb"
    - "!**/*.gltf"
    - "!**/*.bin"
    - "!**/*.pinbundle"
    - "!**/*.zip"
    # Compiled Wasm (the .wat sources stay in review)
    - "!**/*.wasm"
    # Lockfiles and vendoring leftovers
    - "!**/Cargo.lock"
    - "!**/packages.lock.json"
    - "!**/*.orig"
    # Recorded test data: sensor traces, expected-output dumps, proptest seeds
    - "!**/spec_fixtures/**/*.csv"
    - "!**/fixtures/**/*.expected.txt"
    - "!**/fixtures/**/*.mapping.txt"
    - "!**/fixtures/debug_scene_*.txt"
    - "!**/proptest-regressions/**"
    - "!crates/pin_script/tests/attack_corpus/RESULTS_*.txt"
    # Build output (normally ignored by git; listed in case it is ever committed)
    - "!**/target/**"
    - "!tools/dof_bridge/**/bin/**"
    - "!tools/dof_bridge/**/obj/**"
    - "!dist/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        This is a cumulative phase or milestone gate review: the diff is every change merged since
        the previous gate. Look across files and crates for what per-unit work misses:
        architectural drift, duplicated logic, mismatched contracts, awkward state transitions and
        test gaps. Prioritise issues that are expensive to change later or block correctness:
        architectural boundaries, public interfaces/schemas/wire contracts,
        concurrency/state-machine/timing defects, determinism (R3), sim-thread
        blocking/allocations (R4), untrusted-table security boundaries (R11), and verified
        correctness bugs. Skip cosmetic style and formatting (rustfmt, clippy and unit/spec tests
        cover them). Mention any repeated pattern once at summary level instead of posting
        duplicate inline comments.
    - path: "crates/**/src/**"
      instructions: >-
        Check the rules of docs/PROCESS.md. R4: no heap allocation, mutex or file I/O inside
        step_1ms() (the two exemptions are the Lua VM's capped arena and a hot-reload swap tick).
        R3: fixed iteration order (no HashMap/HashSet iteration that can affect a result), no
        fast-math or FMA, libm for transcendentals, randomness only from the sim-owned seeded PCG,
        integer-only table rules logic. R7: no branches on named behaviours in solver code.
        R2: pin_core changes only through contracts/CHANGE_REQUESTS.md. SI units internally
        (docs/SPEC.md §3.1, D17). R11: table bundles are untrusted; parsers must not panic on
        hostile input, and the Lua/Wasm sandbox, budgets, memory caps and zip limits stay intact.
    - path: "crates/**/tests/**"
      instructions: >-
        Tests must not sleep or assert on wall-clock time (PROCESS.md R6). Flag skipped, ignored
        or weakened assertions (R10). Core crates' tests need no display server or GPU; render
        tests sit behind the gpu-tests feature (R5). Image tests follow R12: analytic pixel
        assertions first, a regression snapshot only after them, never a snapshot alone.
    - path: "docs/**"
      instructions: >-
        Planning, process, and decision records; flag only substantive contradictions with
        docs/SPEC.md or docs/PROCESS.md, broken commands/links, or schema/format violations
        (e.g. docs/DECISIONS.md and docs/HUMAN_QUEUE.md contracts). Skip prose phrasing nits.
chat:
  auto_reply: true

# CodeRabbit is the only code reviewer (docs/PROCESS.md R9 and P6, D36).
#
# Review phase: INITIAL USABLE BUILD (M1 — Play experience, tracking issue #79).
# While M1 assembles the first playable end-to-end build, per-PR auto-review is opt-in by PR label:
#   - `review:skip` (or no opt-in label): skipped during M1 vertical slices (tests, work-verifier
#     and CI `pr-checks` still gate every merge).
#   - `review:sanity`: targeted single-pass sanity review on contracts, public schemas/interfaces,
#     cross-layer boundaries, concurrency/timing loops, very-high blast radius, R11 security paths,
#     and milestone gates.
#   - `review:full`: full review (M1 cohesive review pass #153 / KP-064, or explicit opt-in).
# When #153 (KP-064) merges after Gate A3, flip `profile` to `chill`, `auto_review.enabled` to
# `true`, and `auto_review.labels` to `["!review:skip"]` for tighter post-usable per-chunk reviews.
language: en-US
reviews:
  # Critical and major findings inline; minor/nitpicks collapsed in the summary during M1.
  profile: quiet
  # Approve once every comment is resolved on reviewed PRs (PROCESS.md P6 step 5).
  request_changes_workflow: true
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    # Opt-in by positive label during M1; flip to `true` with `["!review:skip"]` in #153 (KP-064).
    enabled: false
    drafts: false
    auto_incremental_review: true
    # Pause after 2 reviewed commits so fix rounds are batched locally instead of looping; use
    # `@coderabbitai review` explicitly when another pass is needed.
    auto_pause_after_reviewed_commits: 2
    labels:
      - "review:sanity"
      - "review:full"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    base_branches:
      - main
  # Skip files a reviewer cannot read or that are generated, vendored or recorded data.
  # Code, shaders, Lua/Wasm-text table rules, TOML manifests, CI and docs stay in review.
  path_filters:
    # Images and textures (including raw test-reference pixel dumps)
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.bmp"
    - "!**/*.tga"
    - "!**/*.ktx2"
    - "!**/*.dds"
    - "!**/*.hdr"
    - "!**/*.exr"
    - "!**/*.ico"
    - "!**/*.rgba8"
    # Audio
    - "!**/*.ogg"
    - "!**/*.wav"
    - "!**/*.mp3"
    - "!**/*.flac"
    # Fonts
    - "!**/*.ttf"
    - "!**/*.otf"
    - "!**/*.woff"
    - "!**/*.woff2"
    # 3D models and packaged tables
    - "!**/*.glb"
    - "!**/*.gltf"
    - "!**/*.bin"
    - "!**/*.pinbundle"
    - "!**/*.zip"
    # Compiled Wasm (the .wat sources stay in review)
    - "!**/*.wasm"
    # Lockfiles and vendoring leftovers
    - "!**/Cargo.lock"
    - "!**/packages.lock.json"
    - "!**/*.orig"
    # Recorded test data: sensor traces, expected-output dumps, proptest seeds
    - "!**/spec_fixtures/**/*.csv"
    - "!**/fixtures/**/*.expected.txt"
    - "!**/fixtures/**/*.mapping.txt"
    - "!**/fixtures/debug_scene_*.txt"
    - "!**/proptest-regressions/**"
    - "!crates/pin_script/tests/attack_corpus/RESULTS_*.txt"
    # Build output (normally ignored by git; listed in case it is ever committed)
    - "!**/target/**"
    - "!tools/dof_bridge/**/bin/**"
    - "!tools/dof_bridge/**/obj/**"
    - "!dist/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Focus on issues that are expensive to change later or block correctness: architectural
        boundaries, public interfaces/schemas/wire contracts, concurrency/state-machine/timing
        defects, determinism (R3), sim-thread blocking/allocations (R4), untrusted-table security
        boundaries (R11), and verified correctness bugs. Ignore cosmetic style, formatting, and
        minor naming/refactor nitpicks (rustfmt, clippy, and unit/spec tests cover them; broader
        refactors belong in the M1 cohesive review pass #153). Mention any repeated pattern once
        at summary level instead of posting duplicate inline comments.
    - path: "crates/**/src/**"
      instructions: >-
        Check the rules of docs/PROCESS.md. R4: no heap allocation, mutex or file I/O inside
        step_1ms() (the two exemptions are the Lua VM's capped arena and a hot-reload swap tick).
        R3: fixed iteration order (no HashMap/HashSet iteration that can affect a result), no
        fast-math or FMA, libm for transcendentals, randomness only from the sim-owned seeded PCG,
        integer-only table rules logic. R7: no branches on named behaviours in solver code.
        R2: pin_core changes only through contracts/CHANGE_REQUESTS.md. SI units internally
        (docs/SPEC.md §3.1, D17). R11: table bundles are untrusted; parsers must not panic on
        hostile input, and the Lua/Wasm sandbox, budgets, memory caps and zip limits stay intact.
    - path: "crates/**/tests/**"
      instructions: >-
        Tests must not sleep or assert on wall-clock time (PROCESS.md R6). Flag skipped, ignored
        or weakened assertions (R10). Core crates' tests need no display server or GPU; render
        tests sit behind the gpu-tests feature (R5). Image tests follow R12: analytic pixel
        assertions first, a regression snapshot only after them, never a snapshot alone.
    - path: "docs/**"
      instructions: >-
        Planning, process, and decision records; flag only substantive contradictions with
        docs/SPEC.md or docs/PROCESS.md, broken commands/links, or schema/format violations
        (e.g. docs/DECISIONS.md and docs/HUMAN_QUEUE.md contracts). Skip prose phrasing nits.
chat:
  auto_reply: true

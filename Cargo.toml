# Kilohertz Pinball workspace (PLAN.md §2.1). Created by Subphase 1.1.
# spikes/ is a separate workspace (Subphase 0.1) and is excluded here.
[workspace]
resolver = "3"
members = ["crates/*", "crates/pin_script/guest-sdk"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"

# Pins copied unchanged from versions.toml (Subphase 0.1), with the feature sets
# recorded there. Crates enable these with `<name>.workspace = true`.
[workspace.dependencies]
# Internal crates.
pin_core = { path = "crates/pin_core" }
pin_testmain = { path = "crates/pin_testmain" }

# Platform.
sdl3 = { version = "=0.22.1", features = ["build-from-source-static", "raw-window-handle"] }
sdl3-sys = "=0.7.3"
raw-window-handle = "=0.6.2"

# Graphics.
wgpu = "=30.0.1"
pollster = "=1.0.1"

# Physics.
parry3d = "=0.31.1"
glamx = "=0.3.1"
glam = "=0.33.12"
simba = "=0.10.2"

# Scripting.
mlua = { version = "=0.12.2", features = ["lua54", "vendored"] }
wasmtime = "=50.0.1"

# Utility.
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"
arrayvec = "=0.7.8"
rand_pcg = "=0.10.2"
rand_core = "=0.10.1"
proptest = "=1.12.0"
notify = "=8.2.2"
# Default features off (4.1): `import` reads the real filesystem; bundles go through pin_assets' VFS.
gltf = { version = "=1.4.1", default-features = false, features = ["names", "extras", "utils"] }
egui = { version = "=0.37.0", features = ["default_fonts"] }  # 4.4 review B1: menu text needs the bundled fonts
egui-wgpu = "=0.37.0"
libm = "=0.2.16"

# Wave 3 additions (Orchestrator; DECISIONS.md "Orchestrator — Wave 3 brief decisions").
# Not in versions.toml: its [crates] must match the spikes lockfile (0.1 spike test).
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
hound = "=3.5.1"
lewton = "=0.10.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
serde_json = "=1.0.151"
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }  # 4.1: own inflate with live ratio check
crc32fast = "=1.5.5"
wat = "=1.263.0"           # 4.5: WAT → binary before the module pre-scan (same version wasmtime resolves)
ogg = "=0.8.0"            # 3.3: packet reader for the vendored lewton

# Wave 4 additions (5.1)
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }  # 5.1: the version wgpu 30.0.1 uses; shader validation tests

# #164 KP-070 additions (web engine: pin_script backend features; also in versions.toml [crates]).
wasmi = { version = "=2.0.2", default-features = false, features = ["std", "validate", "auto-dispatch", "deterministic"] }  # the web Wasm backend (D10)
wasmparser = "=0.261.0"         # engine-neutral pre-scan; the version wasmtime 50.0.1 resolves
wasm-encoder = "=0.261.0"       # load-time instrumentation (later units); same wasm-tools family
wasm-smith = "=0.261.0"         # dev-dependency: random valid modules for differential tests
arbitrary = "=1.5.0"            # wasm-smith's input (Unstructured); the version it resolves
wasm-bindgen = "=0.2.130"       # wasm32 only in consuming crates ([target.'cfg(target_arch = "wasm32")'.dependencies])
js-sys = "=0.3.107"
web-sys = "=0.3.107"            # feature lists are chosen by the consuming crates
wasm-bindgen-futures = "=0.4.80"

# #163 KP-069 additions
libc = "=0.2.191"  # #163: pin_app test-only xattr helpers (Linux setxattr/fgetxattr/removexattr)

[profile.dev]
# Keep the 1 kHz solver usable in debug test runs.
opt-level = 1

[profile.test]
opt-level = 1

# proptest 1.12.0 has a wrong-sign debug_assert in FloatUniform::sample (negative split step)
# that panics about once per 3e6 f32 range samples; its clamp is correct. Turn off only
# proptest's own debug assertions (DECISIONS "w7pre-proptest-f32"). Re-enable on a fixed release.
[profile.dev.package.proptest]
debug-assertions = false

[profile.test.package.proptest]
debug-assertions = false

# Subphase 4.2 review (DECISIONS.md "Orchestrator — 4.2 review: patched vendored Lua"):
# Lua 5.4 is built from a patched copy of lua-src (third_party/lua-src/KHZ_PATCHES.md).
# sdl3-sys links SDL3 from checkout paths with spaces (third_party/sdl3-sys/KHZ_PATCHES.md).
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
lewton = { path = "third_party/lewton" }
sdl3-sys = { path = "third_party/sdl3-sys" }

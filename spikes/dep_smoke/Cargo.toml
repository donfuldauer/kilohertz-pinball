[package]
name = "dep_smoke"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Compile/link + trivial-use checks for the remaining crates pinned in
# ../versions.toml, and a consistency check of versions.toml vs Cargo.lock.

[dependencies]
serde.workspace = true
toml.workspace = true
arrayvec.workspace = true
rand_pcg.workspace = true
rand_core.workspace = true
notify.workspace = true
gltf.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
libm.workspace = true
# #164 KP-070: the web engine pins. The wasm-bindgen family builds natively
# too (its JS calls panic outside wasm32), so it is compile-checked here.
wasmi.workspace = true
wasmparser.workspace = true
wasm-encoder.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
proptest.workspace = true
# #164 KP-070: random valid modules (wasm-smith reads them from arbitrary bytes).
wasm-smith.workspace = true
arbitrary.workspace = true

# Feature Lab (Subphase 6.4): base table.toml. A playable showcase of the
# restored features: the Banana flipper (2.6), magnet remanence and the
# Glo-Ball's Magnus effect (2.7), the 79.4 mm XL ball with its clearance
# restriction (2.8) and the backbox mini-playfield with a vertical flipper
# (5.5). Lengths mm, angles degrees, masses g.
# Build: tables/feature_lab/build.sh <out_dir> (README.md). The build adds
# the generated playfield (layout.toml) and backbox (backbox_layout.toml)
# entries, whose ids start with "tablegen:".
schema_version = 1

[meta]
id = "feature_lab"
name = "Feature Lab"
author = "Kilohertz Pinball"
version = "1.0.0"
script_entry = "rules.lua"
playfield_mesh = "playfield.glb"
pitch_deg = 6.5
players_max = 1
palette = ["#1b263b", "#e0e1dd", "#ffb703"]

# Every ball the table serves. The XL ball may only be in the XL area: the
# chamber under the left inlane (layout.toml walls[3], walls[14],
# walls[15]), on the main playfield layer.
[balls]
profiles = ["standard_steel", "low_rem_steel", "uv_globall", "jumbo_xl_resin"]
restrict = [
  { profile = "jumbo_xl_resin", layers = [0], area = [[0.0, 0.0], [0.0, 330.0], [130.0, 194.868], [130.0, 0.0]] },
]

# Glo-Ball Magnus coefficient (kg; bounds 0..5e-5, default 1e-5): three
# times the default so the curve of a spinning Glo-Ball shows (DECISIONS
# "6.4 — Glo-Ball Magnus setting").
[physics]
globall_magnus_coeff = 3.0e-5

# Cabinet inputs: switch numbers 1..8.
[cabinet_switches]
left_flipper = 1
right_flipper = 2
left_upper = 3
right_upper = 4
action = 5
start = 6
launch = 7
tilt = 8

# --- Switches (numbers 10..39, all unique) ---------------------------------
# Switch zones are given at the playfield surface (z = 0 for layer 0); the
# loader lifts each zone 13.5 mm (a standard ball's centre height).

# Main drain: two overlapping trough zones spanning the drain funnel's
# bottom (grey-box geometry).
[[switches]]
id = "trough_1"
number = 10
kind = "trough"
layer = 0
position = [225.0, 20.0, 0.0]
radius = 36.0

[[switches]]
id = "trough_2"
number = 11
kind = "trough"
layer = 0
position = [289.0, 20.0, 0.0]
radius = 36.0

[[switches]]
id = "lower_left_eos"
number = 12
kind = "eos"

[[switches]]
id = "lower_right_eos"
number = 13
kind = "eos"

[[switches]]
id = "sling_left_sw"
number = 15
kind = "leaf"

[[switches]]
id = "bumper_1_ring"
number = 17
kind = "ring"

[[switches]]
id = "bumper_2_ring"
number = 18
kind = "ring"

[[switches]]
id = "bumper_3_ring"
number = 19
kind = "ring"

# In the orbit's left leg, above its lower bend.
[[switches]]
id = "orbit_entry"
number = 20
kind = "opto"
layer = 0
position = [38.0, 700.0, 0.0]
radius = 15.0

[[switches]]
id = "orbit_top"
number = 21
kind = "opto"
layer = 0
position = [170.0, 1040.0, 0.0]
radius = 15.0

# In the VUK lane, above its funnel.
[[switches]]
id = "vuk_lane"
number = 22
kind = "opto"
layer = 0
position = [425.0, 560.0, 0.0]
radius = 16.0

# The backbox VUK's switch (the mech's own: closed while it holds a ball).
[[switches]]
id = "bb_vuk_sw"
number = 23
kind = "leaf"

# The holding magnet's pole opto (sees every ball), 25 mm round the pole:
# a comparison ball has left the magnet when its centre is 25 mm away.
[[switches]]
id = "magnet_opto"
number = 24
kind = "opto"
layer = 0
position = [370.0, 420.0, 0.0]
radius = 25.0

# Up the shooter lane: closes as a launched ball passes.
[[switches]]
id = "shooter_lane"
number = 25
kind = "opto"
layer = 0
position = [492.0, 300.0, 0.0]
radius = 15.0

# The plunger mech's switch: closed while a ball touches the plunger tip.
[[switches]]
id = "plunger_tip"
number = 26
kind = "leaf"

# XL area (layer 0): the lane opto on the XL ball's way down and the XL
# trough at the chamber's only rest point (the V of layout.toml walls[14]
# and walls[15], ball centre (90.3, 96.5, 39.7)). Zones are lifted 13.5 mm,
# 26.2 mm under the XL ball's centre, so the radii are large.
[[switches]]
id = "xl_lane"
number = 30
kind = "opto"
layer = 0
position = [70.0, 160.0, 0.0]
radius = 45.0

[[switches]]
id = "xl_trough"
number = 31
kind = "trough"
layer = 0
position = [90.3, 96.5, 0.0]
radius = 45.0

# The backbox flipper's EOS switch.
[[switches]]
id = "bb_flipper_eos"
number = 32
kind = "eos"

# The backbox drain opto (layer 4), just above the drain hole (plane
# u = 130, v = 12, mid-depth): every ball leaving the backbox closes it.
# Position = the ball centre there, table frame, minus the 13.5 mm lift.
[[switches]]
id = "bb_drain"
number = 33
kind = "opto"
layer = 4
position = [387.0, 918.75, 106.44]
radius = 22.0

# --- Coils -------------------------------------------------------------------

[[coils]]
id = "left_flipper_coil"
number = 1
kind = "flipper"

[[coils]]
id = "right_flipper_coil"
number = 2
kind = "flipper"

[[coils]]
id = "bb_flipper_coil"
number = 3
kind = "flipper"

[[coils]]
id = "sling_left_coil"
number = 4
kind = "sling"

[[coils]]
id = "bumper_1_coil"
number = 6
kind = "bumper"

[[coils]]
id = "bumper_2_coil"
number = 7
kind = "bumper"

[[coils]]
id = "bumper_3_coil"
number = 8
kind = "bumper"

[[coils]]
id = "bb_vuk_coil"
number = 9
kind = "vuk"

[[coils]]
id = "plunger_coil"
number = 10
kind = "autoplunger"

# The shooter-lane gate (mech "walls[16]" below): kind "kicker" like the
# 2.5 gate wiring (pin_sim tests/sim_mech_wiring.rs). Pulsed for 1.5 s with
# every plunger pulse (rules.lua).
[[coils]]
id = "lane_gate_coil"
number = 11
kind = "kicker"

# --- Lamps -------------------------------------------------------------------

[[lamps]]
id = "backglass_logo"
number = 40
kind = "flasher"

[[lamps]]
id = "mode_lamp"
number = 41
kind = "insert"
color = "#ffb703"
response = "led"

# --- Magnet ------------------------------------------------------------------

# The holding magnet on the Banana's shot line below the VUK lane's mouth,
# fed by magnet_feed. tau_ms is the remanence time constant (bounds
# 20..200): at the top of its range, so the standard_steel ball's residual
# pull lasts as long as possible. Number 0: the magnet's id equals its
# index in the simulation's magnet list. k_coil 2e-5 N m^3 (8 N at the pole, ten
# times the grey-box magnet): the residual pull is proportional to it, and
# it gives a 76 ms longer release for standard_steel than for
# low_rem_steel (329 vs 253 ms; at 2e-6 the gap was 11..19 ms). DECISIONS
# "6.4 — magnet comparison result".
[[magnets]]
id = "hold_magnet"
number = 0
position = [370.0, 420.0, 0.0]
k_coil = 2.0e-5
d_min = 8.0
range = 40.0
tau_ms = 200.0

# --- Flippers ----------------------------------------------------------------

[[flippers]]
id = "lower_left"
coil = "left_flipper_coil"
eos_switch = "lower_left_eos"
collision_layer = 0
base_position = [157.0, 150.0, 0.0]
surface_normal = [0.0, 0.0, 1.0]
rest_angle_deg = -30.0
sweep_angle_deg = 50.0
eos_angle_fraction = 0.92
shape = { type = "StraightCapsule", length = 76.0, base_radius = 11.0, tip_radius = 6.5 }
staging = { type = "DedicatedButton", input = "left_flipper" }

# The Banana: a curved bat of 76 mm chord bent on a 120 mm radius
# (2 * asin(38 / 120) = 36.92 degrees, the sweep lint's arc), concave face
# leading the swing, so its tip curls up the table
# (docs/decisions/2026-11-18-w7pre-banana-pose.md).
[[flippers]]
id = "lower_right"
coil = "right_flipper_coil"
eos_switch = "lower_right_eos"
collision_layer = 0
base_position = [357.0, 150.0, 0.0]
surface_normal = [0.0, 0.0, 1.0]
rest_angle_deg = 210.0
sweep_angle_deg = -50.0
eos_angle_fraction = 0.92
shape = { type = "CurvedBanana", length = 76.0, arc_radius = 120.0, arc_sweep_deg = 36.92, tube_radius = 9.0 }
staging = { type = "DedicatedButton", input = "right_flipper" }

# --- Layer transitions ----------------------------------------------------

# Safety nets for a backbox ball (layer 4) that falls back out of the box.
# A 4 -> 0 transition puts the ball on layer 0 where its centre entered the
# zone, with its velocity, so no such zone may reach into the closed pocket:
# from y 744 up, the strip between the cabinet wall and the orbit's outer
# rail (<= 15.7 mm from the wall) is closed, and a ball returned there stays
# stuck (docs/DECISIONS.md "PR #142 — Feature Lab bb_catch no longer returns
# a ball into the closed pocket"). Under the backbox that strip reaches x 52
# from y 955.75 and x 64.75 at y 990, so the zones at y >= 955 start at x 66.
# None of them affects a layer-0 ball.
#
# bb_catch, under the whole backbox (plane u -205..205, v -130..-85, as a
# table-frame box reaching 100 mm in front of the box), and bb_catch_back
# behind it up to y 990 (about 70 mm behind the box): a backbox ball that
# falls below the shelf outside the drain (back through the entry hole,
# also when it moves towards the player or towards the back as it falls, up
# to 0.6 m/s either way) returns to the playfield layer just above the
# floor instead of falling out of the table (docs/DECISIONS.md "6.4-cr1 —
# bb_catch covers a +y drift"). Both lie below the generated entry
# (0 -> 4) and drain (4 -> 0) zones and touch neither.
[[layer_transitions]]
id = "bb_catch"
from_layer = 4
to_layer = 0
zone = { min = [52.0, 780.0, -24.0], max = [462.0, 955.0, 25.0] }

[[layer_transitions]]
id = "bb_catch_back"
from_layer = 4
to_layer = 0
zone = { min = [66.0, 955.0, -24.0], max = [462.0, 990.0, 25.0] }

# The cups: five boxes around the generated entry zone (x 67..137,
# y 893.2..932.5, z 46.4..90.1), on its four sides and under it, from z 25
# (the top of bb_catch) to z 96, each 0.4..0.5 mm clear of it. A keyboard
# or gamepad nudge pushes every ball, the one falling back through the
# entry channel too: nudged, it can fall around the channel sideways or
# towards the back fast enough to pass left of bb_catch and bb_catch_left
# and leave the table, or to reach the pocket corner. The cups return it to
# the playfield next to the channel, over the orbit lane and the open
# playfield beside it, before it drifts that far.
[[layer_transitions]]
id = "bb_cup_left"
from_layer = 4
to_layer = 0
zone = { min = [48.0, 880.0, 25.0], max = [66.5, 944.0, 96.0] }

[[layer_transitions]]
id = "bb_cup_front"
from_layer = 4
to_layer = 0
zone = { min = [48.0, 870.0, 46.0], max = [150.0, 892.8, 96.0] }

[[layer_transitions]]
id = "bb_cup_back"
from_layer = 4
to_layer = 0
zone = { min = [48.0, 933.0, 46.0], max = [150.0, 944.0, 96.0] }

[[layer_transitions]]
id = "bb_cup_right"
from_layer = 4
to_layer = 0
zone = { min = [137.5, 870.0, 46.0], max = [150.0, 944.0, 96.0] }

[[layer_transitions]]
id = "bb_cup_floor"
from_layer = 4
to_layer = 0
zone = { min = [48.0, 870.0, 25.0], max = [150.0, 944.0, 46.0] }

# Left of bb_catch: a backbox ball thrown left (off the top of the backbox
# walls[1]) can fall through the entry hole (x 67..137) and cross z 25 at x
# 39..51, left of bb_catch, and leave the table on layer 4 (Gate A2 run 1
# EscapedBall). This box returns it to the playfield in the orbit lane's
# clear band. It stays out of the entry zone (x >= 67, z 46..90) and the
# drain zone, and spans only y 895..935: at y >= 744 the orbit's outer rail
# is <= 15.7 mm from the cabinet wall, a closed pocket a ball must never be
# returned into (docs/decisions/2026-11-19-6.4-a2fix.md "6.4-a2-catch").
[[layer_transitions]]
id = "bb_catch_left"
from_layer = 4
to_layer = 0
zone = { min = [45.0, 895.0, 25.0], max = [59.0, 935.0, 96.0] }

# --- Ball dispensers -----------------------------------------------------------

# Serves the shooter lane above the plunger tip (the player's ball).
[[dispensers]]
id = "feed"
number = 1
exit_position = [492.0, 160.0, 13.5]
exit_velocity = [0.0, -0.2, 0.0]
contents = ["standard_steel"]

# Serves the magnet comparison balls straight onto the holding magnet's
# pole, at rest (a ball rising out of the pole piece); the rules choose the
# profile (spawn_ball) and energise the magnet first. A rolling ball is not
# caught: the pull is conservative, so a ball that rolls into the pole
# rolls out again on the far side.
[[dispensers]]
id = "magnet_feed"
number = 2
exit_position = [370.0, 420.0, 13.5]
exit_velocity = [0.0, 0.0, 0.0]
contents = ["standard_steel", "low_rem_steel"]

# Serves the XL ball inside the XL area (ball centre 39.7 mm up).
[[dispensers]]
id = "xl_feed"
number = 3
exit_position = [55.0, 210.0, 39.7]
exit_velocity = [0.1, -0.1, 0.0]
contents = ["jumbo_xl_resin"]

# Serves the Glo-Ball into the shooter lane; the rules plunge it round the
# orbit.
[[dispensers]]
id = "glo_feed"
number = 4
exit_position = [492.0, 160.0, 13.5]
exit_velocity = [0.0, -0.2, 0.0]
contents = ["uv_globall"]

# --- Mechs -------------------------------------------------------------------

# One slingshot, on the left. The Banana's curl sends its shots up the
# right of the table, where a right sling would stop them; the space above
# the right inlane is open playfield instead.
# Moved 30 mm out from (100, 290) along the left inlane wall's normal with
# its guard (layout.toml walls[12]) to widen the left inlane mouth
# (docs/decisions/2026-11-19-6.4-a2fix.md "6.4-a2-inlane").
[[mechs]]
id = "sling_left"
kind = "sling"
coil = "sling_left_coil"
switch = "sling_left_sw"
position = [121.62, 310.80, 0.0]
angle_deg = 35.0

[[mechs]]
id = "bumper_1"
kind = "bumper"
coil = "bumper_1_coil"
switch = "bumper_1_ring"
position = [190.0, 720.0, 0.0]

[[mechs]]
id = "bumper_2"
kind = "bumper"
coil = "bumper_2_coil"
switch = "bumper_2_ring"
position = [324.0, 720.0, 0.0]

[[mechs]]
id = "bumper_3"
kind = "bumper"
coil = "bumper_3_coil"
switch = "bumper_3_ring"
position = [257.0, 810.0, 0.0]

[[mechs]]
id = "plunger"
kind = "plunger"
coil = "plunger_coil"
switch = "plunger_tip"
position = [492.0, 50.0, 0.0]
angle_deg = 90.0
auto_pull = 0.9

# The shooter-lane gate: layout.toml walls[16], across the gap between the
# lane wall's top (470, 930) and the corner wall (470, 1000). Closed (solid)
# by default; open while lane_gate_coil is energised. The rules pulse the
# coil for 1.5 s with each plunger pulse, so the plunged ball passes (it
# crosses y 964..981 within 1.5 s); a ball kicked up the right side by the
# bumpers cannot re-enter the lane from the top and be relaunched (Gate A2
# run 1 EndlessBall, docs/decisions/2026-11-19-6.4-a2fix.md
# "6.4-a2-gate").
[[mechs]]
id = "walls[16]"
kind = "gate"
coil = "lane_gate_coil"
position = [470.0, 965.0, 0.0]

# --- Coverage declarations (2.9 soak harness) ----------------------------------

# The qualifying shots, one per mode in selector order (rules.lua). EOS
# switches are closed at rest and close again only when the bat drops back,
# after the ball has left it, so no shot starts with a flip.

# banana_shots: the Banana's shot up the VUK lane into the scoop. The bat's
# curl sends its shots up the right of the table (a straight bat sends them
# further left), straight at the lane's mouth.
[[shots]]
id = "banana_vuk"
sequence = ["vuk_lane", "bb_vuk_sw"]
window_ms = 3000

# backbox_play: a ball through the backbox, from the VUK scoop to the
# backbox drain.
[[shots]]
id = "backbox_run"
sequence = ["bb_vuk_sw", "bb_drain"]
window_ms = 10000

# xl_ball: the pop bumpers the other way round, bumper_3 then bumper_2.
[[shots]]
id = "pops_down"
sequence = ["bumper_3_ring", "bumper_2_ring"]
window_ms = 5000

# magnet_compare: over the magnet into the VUK lane (the Banana's line).
[[shots]]
id = "magnet_lane"
sequence = ["magnet_opto", "vuk_lane"]
window_ms = 2000

# glo_ball: two pop bumpers in a row.
[[shots]]
id = "pops"
sequence = ["bumper_2_ring", "bumper_3_ring"]
window_ms = 5000

[[modes]]
id = "banana_shots"
start_scene = "scene_banana_shots"

[[modes]]
id = "backbox_play"
start_scene = "scene_backbox_play"

[[modes]]
id = "xl_ball"
start_scene = "scene_xl_ball"

[[modes]]
id = "magnet_compare"
start_scene = "scene_magnet_compare"

[[modes]]
id = "glo_ball"
start_scene = "scene_glo_ball"


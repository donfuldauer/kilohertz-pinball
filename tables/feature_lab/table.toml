# Read by the host and the tests (README "Keys").
[persist]
keys = [
  "games_played", "high_score", "ball", "game_state", "mode_sel",
  "mode:banana_shots", "mode:backbox_play", "mode:xl_ball", "mode:magnet_compare", "mode:glo_ball",
  "cmp_release_ms_standard", "cmp_release_ms_low_rem",
]

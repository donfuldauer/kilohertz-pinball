file = "display/scene_score.toml"

[[scenes]]
id = "scene_game_over"
file = "display/scene_game_over.toml"

[[scenes]]
id = "scene_banana_shots"
file = "display/scene_banana_shots.toml"

[[scenes]]
id = "scene_backbox_play"
file = "display/scene_backbox_play.toml"

[[scenes]]
id = "scene_xl_ball"
file = "display/scene_xl_ball.toml"

[[scenes]]

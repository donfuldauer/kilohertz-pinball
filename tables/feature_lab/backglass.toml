# Feature Lab backglass: the 4.6 placeholder kit's translite art (written
# into the bundle by pin_assetgen), a DMD score display and the backbox
# mini-playfield scene (backbox.glb, generated from backbox_layout.toml by
# the build example). The camera is in the backbox frame, mm: x across, y
# into the box from the glass, z up; it looks at the middle of the 400 x
# 300 mm box from 600 mm in front of the glass.
schema_version = 1

[translite]
layers = [
  { file = "backglass/base.png", depth = 0 },
  { file = "backglass/logo.png", depth = 1, lamp_mask = "bg_logo" },
]

[[lamp_masks]]
id = "bg_logo"
lamp = "backglass_logo"
file = "backglass/logo_mask.png"

[score_display]
mode = "dmd"
dmd = { width = 128, height = 32, color = "orange" }
lcd = { width = 1920, height = 1080 }

[backbox]
scene = "backbox.glb"
camera = { position = [0.0, -600.0, 150.0], look_at = [0.0, 0.0, 150.0], fov_deg = 35.0 }
collision_layer = 4

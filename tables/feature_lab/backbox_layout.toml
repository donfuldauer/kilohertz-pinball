# Feature Lab (Subphase 6.4): the backbox mini-playfield (schema: module
# docs of crates/pin_tablegen/src/backbox/mod.rs). Generated by
# `pin_tablegen build` (build.sh) into backbox.glb, backbox_colliders.glb
# and the merged table.toml.
#
# Plane coordinates [u, v] are mm from `origin`: u across (table x), v up
# the (vertical) backbox. The box stands over the top of the playfield with
# its shelf 110 mm above it, so both generated transitions lie under the
# playfield glass (112 mm): the entry zone (60..20 mm under the entry hole)
# lifts a layer-0 ball that rises through the hole onto layer 4 (the VUK
# itself puts its ball straight onto layer 4, just above the hole), and the
# drain zone (80..30 mm under the drain hole) hands a ball back to layer 0,
# which drops onto the playfield at about (387, 915).
schema_version = 1

[backbox]
origin = [257.0, 900.0, 110.0]
width = 400.0
height = 300.0
depth = 35.0
collision_layer = 4

# The one vertical flipper, driven by the `left_upper` button; its bat
# (rest -30 degrees) catches the ball arriving from the entry channel.
[[backbox.flippers]]
side = "left"
position = [-60.0, 120.0]
length = 60.0
coil = "bb_flipper_coil"
eos_switch = "bb_flipper_eos"
staging = { type = "DedicatedButton", input = "left_upper" }

# Under the left end of the box (a 70 mm hole, u -190..-120, table x
# 67..137, y ~906). The VUK at the top of the main playfield's VUK lane
# puts the ball just above it on layer 4 and ejects it up the entry channel
# (the build example sets the generated VUK's eject; README "Backbox"). The
# shelf left of the hole is 10 mm wide, less than a ball's radius: a ball
# against the box's left side (centre u -186.5) is over the hole, so no
# ball can rest in the channel.
[backbox.entry]
vuk = [425.0, 622.0]
at = -155.0
width = 70.0
coil = "bb_vuk_coil"
switch = "bb_vuk_sw"

[backbox.drain]
at = 130.0

# walls[0]: the floor, sloping down to the right from the entry channel to
# the drain hole's left edge.
[[backbox.walls]]
points = [[-115.0, 50.0], [110.0, 2.0]]

# walls[1]: closes the space under the floor at its high end (and is the
# right side of the entry channel u -200..-115).
[[backbox.walls]]
points = [[-115.0, 50.0], [-115.0, 0.0]]

# walls[2]: slope right of the drain hole, so no ball rests on the shelf
# there.
[[backbox.walls]]
points = [[200.0, 40.0], [150.0, 0.0]]

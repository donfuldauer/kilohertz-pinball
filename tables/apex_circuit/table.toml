# --- Wireform ramp and layer transitions -------------------------------------

# Climbs straight up the right side (x = 425) from the entry lane
# (layout.toml) onto the upper deck. Point heights are the rails' height:
# with the 13 mm gauge a 27 mm ball rides 11.8 mm above them (contact 29
# degrees from vertical). The rails start 6 mm below the playfield and rise
# through the layer-2 floor of the entry lane; they reach the contact height
# of a ball rolling on that floor (13.6 - 11.8 = 1.8 mm) at y ~662, so the
# ball rolls onto the rails from below and never strikes a rail end. The
# last two points (51.5, 51.8 mm), level over the deck, put the ball centre
# at the deck's rest height (50 + 13.5 mm): it rolls onto the deck instead
# of being thrown over it.
[[splines]]
id = "ramp_wire"
kind = "wireform"
layer = 2
gauge = 13.0
points = [[425.0, 595.0, -6.0], [425.0, 650.0, 0.0], [425.0, 705.0, 5.0], [425.0, 760.0, 12.0], [425.0, 815.0, 21.0], [425.0, 850.0, 27.5], [425.0, 880.0, 31.5], [425.0, 905.0, 31.8]]

# Side rails of the wire (layer 2, wall_height walls whose bottom edge runs
# 6 mm below the rails), in line with the entry lane's walls: they keep the
# ball over the rails from the entry zone to the top.
[[splines]]
id = "ramp_side_left"
kind = "guide"
layer = 2
points = [[405.0, 565.0, -12.0], [405.0, 590.0, -12.0], [405.0, 615.0, -9.7], [405.0, 640.0, -7.0], [405.0, 665.0, -4.6], [405.0, 690.0, -2.4], [405.0, 715.0, 0.1], [405.0, 740.0, 3.2], [405.0, 765.0, 6.7], [405.0, 790.0, 10.7], [405.0, 815.0, 15.0], [405.0, 840.0, 19.7], [405.0, 865.0, 23.9], [405.0, 890.0, 25.9]]

[[splines]]
id = "ramp_side_right"
kind = "guide"
layer = 2
points = [[445.0, 565.0, -12.0], [445.0, 590.0, -12.0], [445.0, 615.0, -9.7], [445.0, 640.0, -7.0], [445.0, 665.0, -4.6], [445.0, 690.0, -2.4], [445.0, 715.0, 0.1], [445.0, 740.0, 3.2], [445.0, 765.0, 6.7], [445.0, 790.0, 10.7], [445.0, 815.0, 15.0], [445.0, 840.0, 19.7], [445.0, 865.0, 23.9], [445.0, 890.0, 25.9]]

# Deck rails (layer 1, on the deck surface at z = 50): left, top and right
# edges. The lower edge is open.
[[splines]]
id = "deck_rail_left"
kind = "guide"
layer = 1
points = [[300.0, 870.0, 30.0], [300.0, 950.0, 30.0], [300.0, 1040.0, 30.0]]

[[splines]]
id = "deck_rail_top"
kind = "guide"
layer = 1
points = [[300.0, 1040.0, 30.0], [380.0, 1040.0, 30.0], [460.0, 1040.0, 30.0]]

[[splines]]
id = "deck_rail_right"
kind = "guide"
layer = 1
points = [[460.0, 1040.0, 30.0], [460.0, 950.0, 30.0], [460.0, 870.0, 30.0]]

# The end of the wire: the ball (centre at the deck's rest height there)
# rolls onto the deck.
[[layer_transitions]]
id = "ramp_exit"
from_layer = 2
to_layer = 1
zone = { min = [395.0, 875.0, 30.0], max = [455.0, 950.0, 140.0] }

# A layer-2 ball leaving the entry zone downwards (rolled back down the
# wire) returns to layer 0 in the entry lane. The zone ends 21 mm below the
# generated entry zone (y 595..635, from the rails' start along the wire;
# pin_tablegen refuses an entry zone that overlaps a 2 -> 0 zone), so it
# never contains a ball that has just been promoted.
[[layer_transitions]]
id = "ramp_fallback"
from_layer = 2
to_layer = 0
zone = { min = [375.0, 350.0, -50.0], max = [465.0, 574.0, 150.0] }

# Catch zones beside and below the wire (from the entry zone to the wire's
# end): a layer-2 ball that gets outside the side rails or sinks below the
# floor returns to layer 0 at once, so it never falls through the
# playfield or passes through a wall.
[[layer_transitions]]
id = "ramp_catch_left"
from_layer = 2
to_layer = 0
zone = { min = [325.0, 575.0, -50.0], max = [403.0, 890.0, 200.0] }

[[layer_transitions]]
id = "ramp_catch_right"
from_layer = 2
to_layer = 0
zone = { min = [447.0, 575.0, -50.0], max = [525.0, 890.0, 200.0] }

# Below the floor (x 403..447, y 575..890, z -50..9), in five parts around
# the generated entry zone (x 405..445, y 595..634.7894, z -6..20), which a
# 2 -> 0 zone may neither overlap nor touch (pin_tablegen's bounds are
# inclusive). Each face towards the entry zone is the adjacent f32 just
# outside it (594.99994 below 595, 634.7895 above 634.7894, 404.99997 below
# 405, 445.00003 above 445, -6.0000005 below -6), so only a one-ulp sliver
# with no representable f32 inside is left between them. 634.7895 follows
# the entry zone's generated y max (from layout.toml): if the layout moves
# the rails' start, update it (greybox_below_deck_catch_has_no_gaps in
# pin_tablegen's ramp_entry tests fails until it is). The catches may touch
# one another.
[[layer_transitions]]
id = "ramp_catch_below_mouth"
from_layer = 2
to_layer = 0
zone = { min = [403.0, 575.0, -50.0], max = [447.0, 594.99994, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below"
from_layer = 2
to_layer = 0
zone = { min = [403.0, 634.7895, -50.0], max = [447.0, 890.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below_side_left"
from_layer = 2
to_layer = 0
zone = { min = [403.0, 575.0, -50.0], max = [404.99997, 890.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below_side_right"
from_layer = 2
to_layer = 0
zone = { min = [445.00003, 575.0, -50.0], max = [447.0, 890.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below_under"
from_layer = 2
to_layer = 0
zone = { min = [403.0, 575.0, -50.0], max = [447.0, 890.0, -6.0000005] }

# Over the deck's lower edge back to the playfield.
[[layer_transitions]]
id = "deck_exit"
from_layer = 1
to_layer = 0
zone = { min = [290.0, 800.0, -50.0], max = [470.0, 858.0, 200.0] }

# Safety exits on the railed edges (a ball can only get there over a rail).
[[layer_transitions]]
id = "deck_exit_left"
from_layer = 1
to_layer = 0
zone = { min = [240.0, 859.0, -50.0], max = [298.0, 1100.0, 200.0] }

[[layer_transitions]]
id = "deck_exit_right"
from_layer = 1
to_layer = 0
zone = { min = [462.0, 859.0, -50.0], max = [520.0, 1100.0, 200.0] }

[[layer_transitions]]
id = "deck_exit_top"
from_layer = 1
to_layer = 0
zone = { min = [299.0, 1042.0, -50.0], max = [461.0, 1100.0, 200.0] }


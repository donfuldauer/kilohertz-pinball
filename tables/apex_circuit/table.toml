# pivot slides 12 mm inward along x (in 50 ms), closing the gap to 24 mm,
# under the 27 mm ball (the PLAN 2.3 Zipper criterion).
[[flippers]]
id = "left_flipper"
coil = "left_flipper_coil"
eos_switch = "left_flipper_eos"
collision_layer = 0

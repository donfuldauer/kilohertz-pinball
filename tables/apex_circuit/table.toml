# Rule state the host can read (persist_get / Simulation::persist). The
# `mode:<id>` keys are the soak's mode-start signal (DECISIONS "2.9 —
# mode-start signal"): rules.lua adds 1 each time the mode starts.
[persist]
keys = ["ball", "game_state", "high_score", "games_played", "firewall_save_count", "apex_jackpot_count", "skill_shot_count", "mode:powerball_mania", "mode:combo_chain", "combo_level", "overdrive_ready", "last_bonus"]

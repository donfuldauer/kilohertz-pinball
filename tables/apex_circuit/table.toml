# --- Coverage declarations (2.9 soak harness, Gate A2) ---------------------------

# Up the left orbit through the spinner and round the top.
[[shots]]
id = "left_orbit"
sequence = ["left_spinner", "orbit_top"]
window_ms = 3000

# Up the right orbit and through the magnet pair in the shooter-lane top.
[[shots]]
id = "right_orbit"
sequence = ["right_orbit_entry", "magnet_opto"]
window_ms = 2000

# The upper-right cross-shot jackpot ramp.
[[shots]]
id = "cross_ramp"
sequence = ["ramp_entry", "ramp_made"]
window_ms = 3000

# All three drop targets (a bank stays down until the rules reset it, so
# the window spans a ball's worth of play).
# Known limitation: the pin_sim monitor currently keeps sequence progress
# across a ball drain, so a bank split over two balls inside the window can
# be credited. Clearing progress on drain/reset is deferred to the Gate A2
# harness work (queue: docs/queue/6.1.md).
[[shots]]
id = "drop_bank"
sequence = ["drop_1_sw", "drop_2_sw", "drop_3_sw"]
window_ms = 60000

[[shots]]
id = "lock_scoop"
sequence = ["lock_lane", "lock_scoop_sw"]
window_ms = 1500

[[modes]]
id = "powerball_mania"
start_scene = "scene_powerball_mania"

[[modes]]

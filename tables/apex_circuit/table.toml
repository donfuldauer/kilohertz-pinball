# Apex Circuit (Subphase 6.1, variant A): base table.toml for pin_tablegen.
# Standard-body playfield (514 x 1070 mm, as the grey box). Lengths mm,
# angles degrees. Build: tables/apex_circuit/build.sh <out_dir> (README.md).
# Rules: rules.lua (README.md "Rules").
schema_version = 1

[meta]
id = "apex_circuit"
name = "Apex Circuit"
author = "Kilohertz Pinball"
version = "1.0.0"
script_entry = "rules.lua"
playfield_mesh = "playfield.glb"
pitch_deg = 6.5
players_max = 1
palette = ["#0b132b", "#1c2541", "#ff6b35"]

[balls]
profiles = ["standard_steel", "ceramic_powerball"]

# Cabinet inputs: switch numbers 1..8.
[cabinet_switches]
left_flipper = 1
right_flipper = 2
left_upper = 3
right_upper = 4
action = 5
start = 6
launch = 7
tilt = 8


# --- Flippers ----------------------------------------------------------------

# Lower flippers: 76 mm StraightCapsule bats like the grey-box pair, pivots
# 180 mm apart (x 167 and 347), resting 25 degrees below horizontal and
# sweeping 45 degrees up to +20 degrees (docs/decisions/2026-11-18-6.2.md
# "6.2-tuning"): about 29 mm clear between the resting tips (a ball just
# fits through), 24 mm between the raised tips (a ball rests on two raised
# bats instead of wedging).
[[flippers]]
id = "lower_left"
coil = "left_flipper_coil"
eos_switch = "lower_left_eos"
collision_layer = 0
base_position = [167.0, 150.0, 0.0]
surface_normal = [0.0, 0.0, 1.0]
rest_angle_deg = -25.0
sweep_angle_deg = 45.0
eos_angle_fraction = 0.92
shape = { type = "StraightCapsule", length = 76.0, base_radius = 11.0, tip_radius = 6.5 }
staging = { type = "DedicatedButton", input = "left_flipper" }

[[flippers]]
id = "lower_right"
coil = "right_flipper_coil"
eos_switch = "lower_right_eos"
collision_layer = 0
base_position = [347.0, 150.0, 0.0]
surface_normal = [0.0, 0.0, 1.0]
rest_angle_deg = 205.0
sweep_angle_deg = -45.0
eos_angle_fraction = 0.92
shape = { type = "StraightCapsule", length = 76.0, base_radius = 11.0, tip_radius = 6.5 }
staging = { type = "DedicatedButton", input = "right_flipper" }

# Upper-deck flipper (layer 1, on the deck surface at z 65): a 52 mm right
# flipper at the deck's lower right, fed by the deck rails, shooting up at
# the drop-target bank. It rests at 202 degrees (22 below horizontal): from
# anywhere on the bat its shots leave 80..95 degrees and cross the bank
# (sky_deck_layers; at the grey-box 210 the tip's shots passed left of it).
[[flippers]]
id = "upper_right"
coil = "upper_flipper_coil"
eos_switch = "upper_right_eos"
collision_layer = 1
base_position = [440.0, 805.0, 65.0]
surface_normal = [0.0, 0.0, 1.0]
rest_angle_deg = 202.0
sweep_angle_deg = -50.0
eos_angle_fraction = 0.92
shape = { type = "StraightCapsule", length = 52.0, base_radius = 9.0, tip_radius = 5.5 }
staging = { type = "DedicatedButton", input = "right_upper" }

# --- Left wireform ramp (layer 2) ----------------------------------------------

# Climbs straight up the left of centre (x = 175) from the entry lane
# (layout.toml) to the landing at the deck height. Point heights are the
# rails' height: with the 13 mm gauge a 27 mm ball rides 11.8 mm above them
# (contact 29 degrees from vertical). The rails start 6 mm below the
# playfield and rise through the layer-2 floor of the entry lane (they reach
# a floor-rolling ball's contact height, 1.8 mm, at y ~627). The last two
# points (66.3, 66.7 mm), level over the landing, put the ball centre at the
# landing's rest height (65 + 13.5 mm).
[[splines]]
id = "ramp_wire"
kind = "wireform"
layer = 2
gauge = 13.0
points = [[175.0, 560.0, -6.0], [175.0, 615.0, 0.0], [175.0, 670.0, 8.0], [175.0, 725.0, 20.0], [175.0, 780.0, 36.0], [175.0, 835.0, 51.0], [175.0, 870.0, 61.0], [175.0, 900.0, 66.3], [175.0, 925.0, 66.7]]

# Side rails of the wire (layer 2, wall_height walls whose bottom edge runs
# 6 mm below the rails), in line with the entry lane's walls.
[[splines]]
id = "ramp_side_left"
kind = "guide"
layer = 2
points = [[155.0, 530.0, -12.0], [155.0, 555.0, -12.0], [155.0, 580.0, -9.8], [155.0, 605.0, -7.1], [155.0, 630.0, -3.8], [155.0, 655.0, -0.2], [155.0, 680.0, 4.2], [155.0, 705.0, 9.6], [155.0, 730.0, 15.5], [155.0, 755.0, 22.7], [155.0, 780.0, 30.0], [155.0, 805.0, 36.8], [155.0, 830.0, 43.6], [155.0, 855.0, 50.7], [155.0, 880.0, 56.8], [155.0, 905.0, 60.4]]

[[splines]]
id = "ramp_side_right"
kind = "guide"
layer = 2
points = [[195.0, 530.0, -12.0], [195.0, 555.0, -12.0], [195.0, 580.0, -9.8], [195.0, 605.0, -7.1], [195.0, 630.0, -3.8], [195.0, 655.0, -0.2], [195.0, 680.0, 4.2], [195.0, 705.0, 9.6], [195.0, 730.0, 15.5], [195.0, 755.0, 22.7], [195.0, 780.0, 30.0], [195.0, 805.0, 36.8], [195.0, 830.0, 43.6], [195.0, 855.0, 50.7], [195.0, 880.0, 56.8], [195.0, 905.0, 60.4]]

# Landing rails (layer 2, on the landing surface at z 65). Left side and
# top closed; the right side opens onto the Sky Bridge above y 930.
[[splines]]
id = "landing_left"
kind = "guide"
layer = 2
points = [[155.0, 905.0, 65.0], [155.0, 940.0, 65.0], [155.0, 975.0, 65.0]]

[[splines]]
id = "landing_top"
kind = "guide"
layer = 2
points = [[158.0, 1000.0, 65.0], [181.0, 1000.0, 65.0], [204.0, 1000.0, 65.0]]

[[splines]]
id = "landing_right"
kind = "guide"
layer = 2
points = [[195.0, 905.0, 65.0], [195.0, 917.5, 65.0], [195.0, 930.0, 65.0]]

# Sky Bridge rails: the lower one falls 18 mm towards the deck, so a slow
# ball on the bridge rolls on onto the deck instead of resting on it.
[[splines]]
id = "bridge_rail_lower"
kind = "guide"
layer = 2
points = [[195.0, 930.0, 65.0], [234.5, 921.0, 65.0], [274.0, 912.0, 65.0]]

[[splines]]
id = "bridge_rail_upper"
kind = "guide"
layer = 2
points = [[204.0, 1000.0, 65.0], [239.0, 1000.0, 65.0], [274.0, 1000.0, 65.0]]

# --- Upper-deck rails (layer 1, on the deck surface at z = 65) ---------------

# Left rail, split by the Sky Bridge's opening (y 915..1002).
[[splines]]
id = "deck_rail_left_lo"
kind = "guide"
layer = 1
points = [[250.0, 880.0, 65.0], [250.0, 897.5, 65.0], [250.0, 915.0, 65.0]]

[[splines]]
id = "deck_rail_left_hi"
kind = "guide"
layer = 1
points = [[250.0, 1002.0, 65.0], [250.0, 1021.0, 65.0], [250.0, 1040.0, 65.0]]

[[splines]]
id = "deck_rail_top"
kind = "guide"
layer = 1

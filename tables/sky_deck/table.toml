layer = 1
points = [[465.0, 1040.0, 65.0], [465.0, 950.0, 65.0], [465.0, 860.0, 65.0]]

# Deck inlane: from the right rail down onto the back of the upper_right
# flipper's pivot cap (pivot (440, 805), cap radius 9).
[[splines]]
id = "deck_inlane"
kind = "guide"
layer = 1
points = [[465.0, 860.0, 65.0], [456.0, 836.0, 65.0], [447.0, 812.0, 65.0]]

# Deck funnel: from the left rail down to the right, ending 38 mm (more than
# a ball) left of the resting flipper's tip. A ball that passes the flipper
# goes through that gap to the deck's lower edge: the acrylic return funnel
# (transition `deck_return`).
[[splines]]
id = "deck_funnel"
kind = "guide"
layer = 1
points = [[250.0, 880.0, 65.0], [302.5, 838.5, 65.0], [355.0, 797.0, 65.0]]

# --- Layer transitions -------------------------------------------------------------

# Sky Bridge onto the upper deck (2 -> 1), inside the deck's outline.
[[layer_transitions]]
id = "bridge_exit"
from_layer = 2
to_layer = 1
zone = { min = [253.0, 905.0, 55.0], max = [274.0, 1005.0, 140.0] }

# A layer-2 ball rolling back down the wire past the entry zone returns to
# layer 0 in the entry lane (below the generated entry zone y 560..600).
[[layer_transitions]]
id = "ramp_fallback"
from_layer = 2
to_layer = 0
zone = { min = [140.0, 340.0, -50.0], max = [210.0, 539.0, 150.0] }

# Catch zones beside the wire (from the entry lane to the side rails' end):
# a layer-2 ball outside the side rails returns to layer 0 at once.
[[layer_transitions]]
id = "ramp_catch_left"
from_layer = 2
to_layer = 0
zone = { min = [90.0, 540.0, -50.0], max = [153.0, 880.0, 200.0] }

[[layer_transitions]]
id = "ramp_catch_right"
from_layer = 2
to_layer = 0
zone = { min = [197.0, 540.0, -50.0], max = [260.0, 880.0, 200.0] }

# Below the floor and the wire (x 153..197, y 540..880, z under 9 mm), in
# parts around the generated entry zone (x 155..195, y 560..~600, z -6..20),
# which a 2 -> 0 zone may not overlap: 1 mm clear of it on every side.
[[layer_transitions]]
id = "ramp_catch_below_mouth"
from_layer = 2
to_layer = 0
zone = { min = [153.0, 540.0, -50.0], max = [197.0, 559.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below"
from_layer = 2
to_layer = 0
zone = { min = [153.0, 601.0, -50.0], max = [197.0, 880.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below_side_left"
from_layer = 2
to_layer = 0
zone = { min = [153.0, 540.0, -50.0], max = [154.0, 880.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below_side_right"
from_layer = 2
to_layer = 0
zone = { min = [196.0, 540.0, -50.0], max = [197.0, 880.0, 9.0] }

[[layer_transitions]]
id = "ramp_catch_below_under"
from_layer = 2
to_layer = 0
zone = { min = [153.0, 540.0, -50.0], max = [197.0, 880.0, -7.0] }

# Below the top of the wire, the landing and the bridge: a layer-2 ball that
# falls off them (ball centre under 40 mm; on the wire there it is above
# 68 mm) returns to layer 0.
[[layer_transitions]]
id = "landing_catch"
from_layer = 2
to_layer = 0
zone = { min = [120.0, 881.0, -50.0], max = [280.0, 1030.0, 40.0] }

# The acrylic return funnel: over the upper deck's lower edge (y 770) back to
# the main deck. Every ball that leaves the deck flipper's area through the
# gap beside its tip lands at about (370, 750) on the main deck.
[[layer_transitions]]
id = "deck_return"
from_layer = 1
to_layer = 0
zone = { min = [240.0, 690.0, -50.0], max = [475.0, 769.0, 200.0] }

# Safety exits on the railed edges (a ball can only get there over a rail
# or out of the Sky Bridge's opening).
[[layer_transitions]]
id = "deck_exit_left"
from_layer = 1
to_layer = 0
zone = { min = [190.0, 771.0, -50.0], max = [248.0, 1100.0, 200.0] }

[[layer_transitions]]
id = "deck_exit_right"
from_layer = 1
to_layer = 0
zone = { min = [467.0, 771.0, -50.0], max = [520.0, 1100.0, 200.0] }

[[layer_transitions]]
id = "deck_exit_top"
from_layer = 1
to_layer = 0
zone = { min = [249.0, 1042.0, -50.0], max = [466.0, 1100.0, 200.0] }

# --- Ball dispensers ---------------------------------------------------------------

# Serves the shooter lane above the plunger tip: one steel ball per ball of
# the game.
[[dispensers]]
id = "feed"
number = 1
exit_position = [492.0, 160.0, 13.5]
exit_velocity = [0.0, -0.2, 0.0]
contents = ["standard_steel", "standard_steel", "standard_steel"]

# The Glo-Ball feed: drops a UV Glo-Ball into the mouth of the centre VUK's
# pocket (layer 0, the only layer a script can spawn on), rolling up into
# the scoop; the VUK lifts it onto the upper deck (layer 1). One per ball of
# the game (Night Overdrive starts at most once per ball).
[[dispensers]]
id = "glo_feed"
number = 2
exit_position = [257.0, 668.0, 13.5]
exit_velocity = [0.0, 0.4, 0.0]
contents = ["uv_globall", "uv_globall", "uv_globall"]

# --- Mechs -------------------------------------------------------------------

[[mechs]]
id = "sling_left"
kind = "sling"
coil = "sling_left_coil"
switch = "sling_left_sw"
position = [100.0, 290.0, 0.0]
angle_deg = 35.0

[[mechs]]
id = "sling_right"
kind = "sling"
coil = "sling_right_coil"
switch = "sling_right_sw"
position = [375.0, 290.0, 0.0]
angle_deg = 145.0

# Centre VUK at the apex of the V pocket (layout.toml), 15 mm clear of its
# walls; capture radius 18 mm. Ejects onto the upper deck (layer 1) at
# (450, 960), beside the right rail just above deck_opto, the ball centre
# 1.5 mm above its rest height on the deck (65 + 13.5 mm), kicked gently
# down the deck towards the upper_right flipper.
[[mechs]]
id = "vuk"
kind = "vuk"
coil = "vuk_coil"
switch = "vuk_sw"
position = [257.0, 692.0, 0.0]
angle_deg = 270.0
layer = 0
radius = 18.0
exit_layer = 1
exit_offset = [193.0, 268.0, 80.0]
eject_speed_m_s = 0.2
kick_speed_m_s = 0.2

[[mechs]]
id = "plunger"
kind = "plunger"
coil = "plunger_coil"
switch = "plunger_tip"
position = [492.0, 50.0, 0.0]
angle_deg = 90.0
auto_pull = 0.9

# "Reactor Core" guard: the captive Newton ball above the right sling,
# moving 50 mm up the table. At y 415 it stands across the line from the
# left sling to the right outlane's mouth, which every plunge followed
# (loop, left sling, right outlane: 5..9 s balls; docs/decisions/
# 2026-11-18-6.2.md "6.2-mechs"); flipper shots and sling kicks hit it.
[[mechs]]
id = "newton"
kind = "newton_ball"
switch = "newton_sw"
position = [330.0, 415.0, 0.0]
angle_deg = 90.0
length = 50.0

# Elevated 3-bank on the upper deck (layer 1, deck surface z 65), above
# the upper_right flipper (whose shots leave it 70..100 degrees, straight up
# the deck). The targets face 290 degrees (down, turned 20 degrees right):
# the bank line rises to the right, so a ball rolling down onto its back
# rolls off its left end instead of resting there. 20 mm tall (top at 85
# mm, above a deck ball's centre at 78.5 mm): a ball that lands on a
# target's top edge has room under the glass (122 mm) and rolls off; its right end is 10 mm
# from the right rail (no ball gets past). One reset coil for the bank.
[[mechs]]
id = "drop_1"
kind = "drop_target"
coil = "drop_reset_coil"
switch = "drop_1_sw"
position = [392.6, 987.8, 65.0]
angle_deg = 290.0
layer = 1
height = 20.0

[[mechs]]
id = "drop_2"
kind = "drop_target"
coil = "drop_reset_coil"
switch = "drop_2_sw"
position = [418.0, 997.0, 65.0]
angle_deg = 290.0
layer = 1
height = 20.0

[[mechs]]
id = "drop_3"
kind = "drop_target"
coil = "drop_reset_coil"
switch = "drop_3_sw"
position = [443.4, 1006.2, 65.0]
angle_deg = 290.0
layer = 1
height = 20.0

# Back stop of the drop bank: 20 mm behind the targets' centre line
# (17.5 mm from their backs, less than a ball), from beyond the bank's left
# end to the right rail. No ball gets behind the bank (or through a dropped
# target's slot); the strip above it is closed by `deck_bank_cap`.
[[splines]]
id = "deck_bank_back"
kind = "guide"
layer = 1
points = [[374.0, 1002.3, 65.0], [419.5, 1018.85, 65.0], [465.0, 1035.4, 65.0]]

# Cap of the strip between the back stop and the top rail: that strip
# narrows to the right from 35 mm to nothing, so a ball thrown into it
# wedged where it is one ball wide (StuckBall at (397, 1026) mm on the deck
# in a novice soak). The cap closes it from the back stop's left end up to
# the top rail, sloping down to the right: a ball against its outside
# rolls down off the bank's left end.
[[splines]]
id = "deck_bank_cap"
kind = "guide"
layer = 1
points = [[374.0, 1002.3, 65.0], [364.0, 1021.15, 65.0], [354.0, 1040.0, 65.0]]

# Sky Bridge Diverter (on the landing, layer 2). The engine binds a
# diverter's colliders by glTF node name (`bridge_diverter` /
# `bridge_diverter.on` / `.off`), which pin_tablegen cannot name; the
# physical blade is the kickback `bridge_blade` on the same coil
# (docs/decisions/2026-11-18-6.2.md "6.2-diverter"). No switch: a diverter
# has none, and a declared one would be held open by the mech set.
[[mechs]]
id = "bridge_diverter"
kind = "diverter"
coil = "bridge_coil"
position = [175.0, 950.0, 65.0]
layer = 2

# The Sky Bridge Diverter's blade: a 50 mm x 12 mm rubber blade on the
# landing (layer 2, z 65) that slides 50 mm along 315 degrees. Retracted
# (coil off) it sits up and left of the ball's path up the landing (x
# 161.5..188.5); held out (coil on) its face crosses the path at 45 degrees
# and turns a ball coming up the landing to the right, onto the Sky Bridge.
# Heavy and slow (500 g, 20 N): it reaches the stop in about 0.05 s and a
# ball barely moves it.
[[mechs]]
id = "bridge_blade"
kind = "kickback"
coil = "bridge_coil"
position = [132.4, 1004.6, 65.0]
angle_deg = 315.0
layer = 2

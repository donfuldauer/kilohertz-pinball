# On the upper deck just below the VUK's exit point (layer 1, surface
# z = 65).
[[switches]]
id = "deck_opto"
number = 22
kind = "opto"
layer = 1
position = [449.0, 945.0, 65.0]
radius = 15.0

# In the loop's left leg.
[[switches]]
id = "loop_entry"
number = 23
kind = "opto"
layer = 0
position = [38.0, 700.0, 0.0]

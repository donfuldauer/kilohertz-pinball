# Sky Deck (Subphase 6.2, variant B): base table.toml for pin_tablegen.
# A two-level table on a standard-body playfield (514 x 1070 mm): the main
# deck (layer 0, z 0), a clear-acrylic upper deck (layer 1, z 65 mm) with
# its own flipper and a 3-bank of drop targets, a centre VUK that lifts the
# ball onto the upper deck, a left wireform ramp (layer 2) ending in the Sky
# Bridge (a diverter that sends the ball onto the upper deck), a captive
# Newton ball ("Reactor Core" guard) and an upper-left wrap-around loop.
# Lengths mm, angles degrees. Build: tables/sky_deck/build.sh <out_dir>
# (README.md). Design notes: docs/decisions/2026-11-18-6.2.md.
schema_version = 1

[meta]
id = "sky_deck"
name = "Sky Deck"
author = "Kilohertz Pinball"
version = "1.0.0"
script_entry = "rules.lua"
playfield_mesh = "playfield.glb"
pitch_deg = 6.5
players_max = 1
palette = ["#0b1d3a", "#3fa7d6", "#b388ff"]

[balls]
profiles = ["standard_steel", "uv_globall"]

# Cabinet inputs: switch numbers 1..8.
[cabinet_switches]
left_flipper = 1
right_flipper = 2
left_upper = 3
right_upper = 4
action = 5
start = 6
launch = 7
tilt = 8

# --- Switches (numbers 10..28, all unique) ---------------------------------
# Switch zones are given at the surface they sit on (z = 0 for layer 0,
# z = 65 on the upper deck); the loader lifts each zone to ball-centre
# height.

# The two trough zones overlap and span the drain funnel's bottom: a ball
# resting in either bottom corner of the funnel (layout.toml) has its
# centre within 8 mm of a zone centre.
[[switches]]
id = "trough_1"
number = 10
kind = "trough"
layer = 0
position = [225.0, 20.0, 0.0]
radius = 36.0

[[switches]]
id = "trough_2"
number = 11
kind = "trough"
layer = 0
position = [289.0, 20.0, 0.0]
radius = 36.0

[[switches]]
id = "lower_left_eos"
number = 12
kind = "eos"

[[switches]]
id = "lower_right_eos"
number = 13
kind = "eos"

[[switches]]
id = "upper_right_eos"
number = 14
kind = "eos"

[[switches]]
id = "sling_left_sw"
number = 15
kind = "leaf"

[[switches]]
id = "sling_right_sw"
number = 16
kind = "leaf"

# The centre VUK's scoop switch (closed while it holds a ball).
[[switches]]
id = "vuk_sw"
number = 17
kind = "leaf"

[[switches]]
id = "newton_sw"
number = 18
kind = "target"

[[switches]]
id = "drop_1_sw"
number = 19
kind = "target"

[[switches]]
id = "drop_2_sw"
number = 20
kind = "target"

[[switches]]
id = "drop_3_sw"

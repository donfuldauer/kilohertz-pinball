number = 25
kind = "opto"
layer = 0
position = [175.0, 525.0, 0.0]
radius = 16.0

# On the wire (layer 2) near its top, before the landing (common to both
# diverter positions): z is the ball-centre height there (rails ~63.7 mm +
# 11.8 mm) minus the 13.5 mm the loader adds.
[[switches]]

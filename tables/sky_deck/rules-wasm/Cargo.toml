# Rust port of ../rules.lua (Subphase 6.3), built to ../rules.wasm by
# ./rebuild.sh. A standalone workspace: never a member of the root
# workspace (it targets wasm32-unknown-unknown). The Lua rules stay the
# default backend; a bundle uses this module only when its table.toml
# names "rules.wasm" as script_entry.
[package]
name = "sky_deck_rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pin_guest_sdk = { path = "../../../crates/pin_script/guest-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
panic = "abort"

[workspace]

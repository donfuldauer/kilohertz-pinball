# Grey-box table (Subphase 6.0, milestone M1): base table.toml for
# pin_tablegen. Every mechanism the engine has so far, one or more of each,
# on a standard-body playfield (514 x 1070 mm). Lengths mm, angles degrees.
# Build: tables/greybox/build.sh <out_dir> (README.md).
schema_version = 1

[meta]
id = "greybox"
name = "Grey Box"
author = "Kilohertz Pinball"
version = "1.0.0"
script_entry = "rules.lua"
playfield_mesh = "playfield.glb"
pitch_deg = 6.5
players_max = 1
palette = ["#2b2d42", "#8d99ae", "#ef233c"]

[balls]
profiles = ["standard_steel", "ceramic_powerball"]

# Cabinet inputs: switch numbers 1..8.
[cabinet_switches]
left_flipper = 1
right_flipper = 2
left_upper = 3
right_upper = 4
action = 5
start = 6
launch = 7
tilt = 8

# --- Switches (numbers 10..39, all unique) ---------------------------------
# Switch zones are given at the playfield surface (z = 0 for layer 0); the
# loader lifts each zone to ball-centre height.

# The two trough zones overlap and span the drain funnel's bottom
# (x 189..325 at ball height; layout.toml funnel walls): a ball cannot come
# to rest on the cabinet bottom between or beside them. They are symmetric
# about the centre line x = 257, so a ball draining down the middle closes
# both. Radius 36 (Gate A1 play-length fix, was 34): a ball resting in the
# corner of the right funnel wall and the cabinet bottom has its centre at
# (323.3, 13.5), 34.9 mm from trough_2's centre at ball height; a standard
# soak found one stuck there.
[[switches]]
id = "trough_1"
number = 10
kind = "trough"
layer = 0
position = [225.0, 20.0, 0.0]
radius = 36.0

[[switches]]
id = "trough_2"
number = 11
kind = "trough"
layer = 0
position = [289.0, 20.0, 0.0]
radius = 36.0

[[switches]]
id = "lower_left_eos"
number = 12
kind = "eos"

[[switches]]
id = "lower_right_eos"
number = 13
kind = "eos"

[[switches]]
id = "upper_left_eos"
number = 14
kind = "eos"

[[switches]]
id = "sling_left_sw"
number = 15
kind = "leaf"

[[switches]]
id = "sling_right_sw"
number = 16
kind = "leaf"

[[switches]]
id = "bumper_1_ring"
number = 17
kind = "ring"

[[switches]]
id = "bumper_2_ring"
number = 18
kind = "ring"

[[switches]]
id = "bumper_3_ring"
number = 19
kind = "ring"

# In the orbit's left leg, above its lower bend (Gate A1 play-length fix:
# the lane now ends at (85, 615), layout.toml).
[[switches]]
id = "orbit_entry"
number = 20
kind = "opto"
layer = 0
position = [38.0, 700.0, 0.0]
radius = 15.0

[[switches]]
id = "orbit_top"
number = 21
kind = "opto"
layer = 0
position = [170.0, 1040.0, 0.0]
radius = 15.0

[[switches]]
id = "ramp_entry"
number = 22
kind = "opto"
layer = 0
position = [425.0, 560.0, 0.0]
radius = 16.0

# On the wire (layer 2), near its top: z is the ball-centre height there
# (rails ~50 mm + 11.8 mm) minus the 13.5 mm the loader adds.
[[switches]]
id = "ramp_made"
number = 23
kind = "opto"
layer = 2
position = [425.0, 868.0, 48.0]
radius = 10.0

[[switches]]
id = "vuk_sw"
number = 24
kind = "leaf"

# Powerball detector: the eddy sensor sees only conductive balls (steel),
# the opto sees every ball. Opto without eddy = the ceramic Powerball.
[[switches]]
id = "magnet_eddy"
number = 25
kind = "eddy"
layer = 0
position = [257.0, 560.0, 0.0]

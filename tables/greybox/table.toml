# Scoop on the left of the playfield; ejects the ball onto the upper deck
# (layer 1, top right). Exit x offset 265 mm (Gate A1 endless-ball fix, was
# 270; docs/DECISIONS.md "a1-endless-table — loop 1: VUK exit offset"):
# from 270 an ejected steel ball followed a fixed path off the deck, round
# the right side and back into the scoop, for ever. Knife-edge relief
# only: +-2 mm on the exit x can restore the loop.
[[mechs]]
id = "vuk"
kind = "vuk"
coil = "vuk_coil"
switch = "vuk_sw"
position = [110.0, 800.0, 0.0]
angle_deg = 270.0
layer = 0
exit_layer = 1
exit_offset = [265.0, 160.0, 65.0]
eject_speed_m_s = 0.2
kick_speed_m_s = 0.1

[[mechs]]
id = "plunger"
kind = "plunger"
coil = "plunger_coil"
switch = "plunger_tip"
position = [492.0, 50.0, 0.0]
angle_deg = 90.0
auto_pull = 0.9

# Above the left flipper's ramp shot line (Gate A1 fix: at y 380 it stood on
# the line from the left flipper to the ramp entry).
[[mechs]]
id = "newton"
kind = "newton_ball"
switch = "newton_sw"
position = [330.0, 450.0, 0.0]
angle_deg = 90.0
length = 50.0

# Turned 20 degrees from facing straight down (Gate A1 fix): a ball rolling
# down onto its back rolls off instead of resting there.
[[mechs]]
id = "drop_1"
kind = "drop_target"
coil = "drop_reset_coil"
switch = "drop_1_sw"
position = [200.0, 470.0, 0.0]
angle_deg = 290.0


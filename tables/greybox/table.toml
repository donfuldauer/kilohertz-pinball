number = 28
kind = "target"

# Up the shooter lane: closes as a launched ball passes.
[[switches]]
id = "shooter_lane"
number = 29
kind = "opto"
layer = 0
position = [492.0, 300.0, 0.0]
radius = 15.0

# The plunger mech's switch: closed while a ball touches the plunger tip.
[[switches]]

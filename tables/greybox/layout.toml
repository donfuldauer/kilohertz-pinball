# Grey-box table (Subphase 6.0, milestone M1): pin_tablegen layout.
# Build the bundle with tables/greybox/build.sh (see README.md).
# Units mm, x across (0 = left), y up the table (0 = bottom).
schema_version = 1

# Walls and posts 90 mm tall under the playfield glass at 112 mm (Gate A1
# zero-escape fix, docs/DECISIONS.md "a1-glass-height — grey-box walls to
# the glass"; was 50 mm walls under the default glass, geometry max z +
# 50 mm). The glass height lives in glass.toml (a1-glass-height — sim reads
# glass.toml); see there for the seal rule (gap under one ball diameter).
# wall_height is also the height of the guides (ramp side rails, deck
# rails; DECISIONS "2.5 — guide wall height").
[playfield]
width = 514.0
length = 1070.0
wall_height = 90.0

# Cabinet: closed outer wall.
[[walls]]
points = [[0.0, 0.0], [0.0, 1070.0], [514.0, 1070.0], [514.0, 0.0]]
closed = true
material = "wood"

# Shooter lane wall (lane x = 470..514).
[[walls]]
points = [[470.0, 0.0], [470.0, 800.0]]
material = "wood"

# Top-right corner: turns the launched ball into the playfield.
[[walls]]
points = [[400.0, 1070.0], [514.0, 956.0]]
material = "wood"

# Inlane slopes onto the flipper pivots. Each ends on the back of the
# pivot cap (11 mm radius): no V-pocket between wall end and cap.
[[walls]]
points = [[0.0, 330.0], [152.0, 172.0]]
material = "wood"

[[walls]]
points = [[470.0, 330.0], [362.0, 172.0]]
material = "wood"

# Drain funnel below the flippers into the trough. The right wall meets the
# cabinet bottom at x = 335 (Gate A1 fix): no pocket beside trough_2 below
# its lower end; the trough switches cover the whole funnel bottom.
[[walls]]
points = [[157.0, 150.0], [215.0, 10.0]]
material = "wood"

[[walls]]
points = [[357.0, 150.0], [335.0, 0.0]]
material = "wood"

# Orbit: from the left side up and around the top (switches orbit_entry,
# orbit_top). Gate A1 play-length fix (docs/DECISIONS.md "6.0 fix —
# grey-box play length (Gate A1 median)"): the lower end bends right and
# ends at (85, 615), above and left of the upper-left flipper (pivot
# (130, 560)), instead of running straight down the left side to y 420.
# Every plunge rides the orbit top first; it now comes out towards the
# upper flipper in mid-field instead of dropping onto the left inlane.
[[lanes]]
kind = "orbit"
points = [[85.0, 615.0], [55.0, 650.0], [38.0, 700.0], [36.0, 780.0], [45.0, 880.0], [90.0, 1000.0], [170.0, 1040.0], [260.0, 1046.0]]
width = 40.0

# Wireform ramp (spline `ramp_wire`, layer 2) up the right side onto the
# upper deck (Gate A1 fix, docs/DECISIONS.md "6.0 fix — Gate A1 grey-box
# geometry"). Entry lane x 405..445, the wire on its axis (x 425). The
# right wall reaches down to y 430 and the left wall starts at y 545 with a
# funnel wall below it, so the mouth takes a ball rolling straight up beside
# the right inlane as well as the left flipper's shots (about 25..35 degrees
# right of straight up), which glance off the right wall. The generated
# 0 -> 2 entry zone (entry_width 40: x 405..445, y 575..615) spans the lane
# exactly. The lane walls end on a roof (y 640..660) sloping down to the
# left from the shooter-lane wall: below it no layer-0 ball can enter the
# entry zone except up the lane, and the roof stays clear of where balls
# land after dropping off the upper deck.
[[ramps]]
spline = "ramp_wire"
entry_width = 40.0

[[walls]]
points = [[370.0, 485.0], [405.0, 545.0], [405.0, 640.0], [470.0, 660.0]]
material = "wood"

[[walls]]
points = [[445.0, 430.0], [445.0, 652.3]]
material = "wood"

# Layer-2 floor of the entry lane (z 0.1 mm, the playfield height): a ball
# promoted in the entry zone rolls on it until the rails rise to its
# contact height (y ~662).
[[decks]]
layer = 2
z = 0.1
outline = [[403.0, 560.0], [447.0, 560.0], [447.0, 692.5], [403.0, 692.5]]
material = "wood"

# Covers over the top of the ramp (z 80 mm, 3 mm above a ball riding the
# wire's last section or rolling onto the deck): a fast ball that leaves the
# rails where they level out is held down instead of flying over the deck
# and its rails. One on the wire's layer, one on the deck's layer past the
# layer change (table.toml `ramp_exit`).
[[decks]]
layer = 2
z = 80.0
outline = [[403.0, 800.0], [447.0, 800.0], [447.0, 905.0], [403.0, 905.0]]
material = "acrylic"

[[decks]]
layer = 1
z = 80.0
outline = [[395.0, 870.0], [455.0, 870.0], [455.0, 960.0], [395.0, 960.0]]
material = "acrylic"

# Upper deck (layer 1, top right): fed by the VUK and the ramp, rails
# (layer-1 guides in table.toml) on three sides, drains back to the
# playfield over its lower edge (transition `deck_exit`). At z 50 mm (Gate A1
# fix, was 60): the ramp climbs 10 mm less.
[[decks]]
layer = 1
z = 50.0
outline = [[300.0, 860.0], [460.0, 860.0], [460.0, 1040.0], [300.0, 1040.0]]
material = "acrylic"

# Gate A1 play-length fix: guide below the upper deck's lower edge. A ball
# dropping off the deck (or coming down the right side above the ramp
# entry) rolls down it to the left and drops onto bumper_2 (324, 720)
# instead of straight down the right side onto the right inlane.
[[walls]]
points = [[468.0, 860.0], [372.0, 800.0]]
material = "wood"

# Gate A1 play-length fix: closes the alcove between the ramp lane's right
# wall (x 445, from y 430) and the shooter-lane wall (x 470). A ball sent
# up the right side is turned left towards the ramp mouth instead of
# stalling in the alcove and creeping back down the right inlane.
[[walls]]
points = [[470.0, 395.0], [445.0, 430.0]]
material = "wood"

# Gate A1 endless-ball fix (docs/DECISIONS.md "a1-endless-table — loop 2:
# fill outside the orbit's right rail"): a fill on the playfield side of
# the orbit's right rail (`tablegen:lanes[0].right`), from the rail's
# through-point (73.5, 658.2) out to (111.5, 724) and back to the rail at
# (55.7, 752.3). The rail's outer face there pointed up and right, so a
# Powerball kicked left by bumper_1 (190, 720) came straight back into it
# (a ping-pong at y 677..712 that never drained). The new lower face is
# turned 30 degrees below horizontal: a ball from bumper_1 leaves it down
# and right, below the bumper. The upper face slopes down to the right, so
# nothing rests on it; the space enclosed with the rail is unreachable.
[[walls]]
points = [[73.53804, 658.2306], [111.5, 724.0], [55.695015, 752.3393]]
material = "wood"

# Gate A1 endless-ball fix (docs/DECISIONS.md "a1-endless-table — loop 3:
# guard behind the left sling"): a guard 2 mm behind the back of sling_left
# (centre (100, 290), kick direction 35 degrees, 100 x 10 mm rubber box),
# over its length plus 3 mm at each end. A ball rolling down the left
# inlane touched the sling's back, which closed the sling switch; the
# refiring sling held a Powerball at (110, 243) for good. The guard keeps
# the inlane corridor at least 29 mm wide (ball 27 mm) and does not touch
# the sling, so the sling and its kick are unchanged.
[[walls]]
points = [[63.87, 329.40], [124.67, 242.57]]
material = "wood"

# Gate A1 endless-ball fix (docs/DECISIONS.md "a1-endless-table — orbit
# top dead spot"): a ramp on the orbit's lower (right) rail at its right
# end, from the rail's through-point (221.7, 1024.5) up to (262, 1034).
# The rail's last 20 mm rise under 2 degrees, flat enough for a slow ball to
# stop there for good (StuckBall at (254, 1039) in a novice soak). On the
# ramp (13 degrees) a slow ball rolls back down the orbit; a fast one leaves
# over its end. Plunged balls pass above it (they enter the lane at y 1046
# and up).
[[walls]]
points = [[221.73027, 1024.4989], [262.0, 1034.0]]
material = "wood"

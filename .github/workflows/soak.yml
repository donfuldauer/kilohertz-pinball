name: soak

# Subphase 7.1: determinism soak (PLAN 7.1, D9). On each OS, the ignored
# `profiler_soak` tests run in release: a 10-minute (600,000-tick) recorded
# multiball replay per shipped table (apex_circuit, sky_deck, feature_lab),
# replayed repeatedly to the same state hash on that machine (a mismatch
# fails the job). Every run prints
#   SOAK_HASH table=<name> os=<os> arch=<arch> ticks=600000 hash=<16 hex>
# and the lines go to the job summary and an artifact. The `cross-os` job
# compares the hashes across OSes and REPORTS a divergence as a warning
# annotation without failing (D9: cross-OS hashes are report-only).
# Kept out of ci.yml (decision 2026-11-19-7.1, "new workflow file"): the soak
# takes tens of minutes per OS, too long for every push.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "crates/pin_app/**"
      - "crates/pin_sim/**"
      - "crates/pin_physics/**"
      - "crates/pin_script/**"
      - "tables/**"
      - ".github/workflows/soak.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SDL_AUDIO_DRIVER: dummy
  SDL_JOYSTICK_ALLOW_BACKGROUND_EVENTS: "1"
  # Exact toolchain from versions.toml [toolchain] (as ci.yml).
  RUST_VERSION: "1.97.0"

jobs:
  soak:
    name: soak (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi

      - name: Install Linux packages (SDL3 build headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libasound2-dev libpulse-dev

      - name: Determinism soak (release, ignored tests)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p pin_app --test profiler_soak -- --ignored --nocapture --test-threads=3 \
            2>&1 | tee soak.log

      - name: Collect SOAK_HASH lines
        if: always()
        shell: bash
        run: |
          touch soak.log
          grep -E '^SOAK_HASH ' soak.log > soak_hash_${{ matrix.target }}.txt || true
          {
            echo "### Soak hashes (${{ matrix.target }})"
            echo
            echo '```'
            cat soak_hash_${{ matrix.target }}.txt
            grep -E '^SOAK_(TICK|INPUT) ' soak.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-hash-${{ matrix.target }}
          path: soak_hash_${{ matrix.target }}.txt
          if-no-files-found: warn

  cross-os:
    name: soak hashes across OSes (report only)
    needs: soak
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: soak-hash-*
          path: hashes
          merge-multiple: true

      - name: Compare hashes (warn, never fail)
        shell: bash
        run: |
          shopt -s nullglob
          files=(hashes/*.txt)
          {
            echo "### Soak hashes across OSes (report only, D9)"
            echo
            echo "| table | os | arch | hash |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=soak cross-OS::no SOAK_HASH lines were collected"
          fi
          # An artifact is created even when a platform printed no SOAK_HASH line.
          for f in "${files[@]}"; do
            if ! grep -qE '^SOAK_HASH ' "$f"; then
              echo "::warning title=soak cross-OS empty artifact::$(basename "$f") has no SOAK_HASH lines"
              echo "Empty artifact: $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # One hash per table and OS (every run on one OS already matched there).
          cat /dev/null "${files[@]}" \
            | sed -E 's/^SOAK_HASH table=([^ ]+) os=([^ ]+) arch=([^ ]+) ticks=[0-9]+ hash=([0-9a-f]+).*/\1 \2 \3 \4/' \
            | sort -u > uniq.txt
          touch uniq.txt
          while read -r table os arch hash; do
            echo "| $table | $os | $arch | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done < uniq.txt
          for table in $(awk '{print $1}' uniq.txt | sort -u); do
            n=$(awk -v t="$table" '$1 == t {print $4}' uniq.txt | sort -u | wc -l)
            if [ "$n" -gt 1 ]; then
              detail=$(awk -v t="$table" '$1 == t {printf "%s/%s=%s ", $2, $3, $4}' uniq.txt)
              echo "::warning title=soak cross-OS divergence ($table)::$detail"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Divergence on $table: $detail" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # Every expected (table, os) pair (os = Rust std::env::consts::OS of each matrix leg).
          missing=""
          for table in apex_circuit sky_deck feature_lab; do
            for os in linux windows macos; do
              if ! awk -v t="$table" -v o="$os" '$1 == t && $2 == o {f=1} END {exit !f}' uniq.txt; then
                echo "::warning title=soak cross-OS missing record::no SOAK_HASH for table=$table os=$os"
                missing="$missing $table/$os"
              fi
            done
          done
          if [ -n "$missing" ]; then
            {
              echo ""
              echo "Missing records (table/os):$missing"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

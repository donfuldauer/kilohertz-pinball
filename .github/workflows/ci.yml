name: ci

# Subphase 1.2: CI matrix skeleton for the root workspace (PLAN.md §4, 1.2).
# Targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-apple-darwin.
#
# D40: pull requests run the Linux set only (fmt, Linux clippy, core-tests, replay-hash; the
# lavapipe GPU tests, the DOF bridge and the qemu-user replay-hash-aarch64 only when their paths
# change). Pushes to main and
# workflow_dispatch run everything: the Windows/macOS legs live in the `*-cross` jobs below
# (job-level `if: github.event_name != 'pull_request'`, so a skipped job reports success), and
# coverage runs on push and workflow_dispatch, not on pull requests. Linux jobs keep their ids; every target stays covered across the file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per workflow, ref and event (event_name keeps a workflow_dispatch run from being
# cancelled by pushes). Only pull_request runs are cancelled when superseded. Push (main) and
# workflow_dispatch runs queue and complete: under D40 they are the only place the Windows/macOS
# legs, GPU tests and coverage run. GitHub keeps at most one pending run per group, so in a burst
# of merges the oldest in-progress run plus the newest queued one run; intermediate commits are
# skipped, which is fine because the newest commit contains all earlier ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Headless SDL hints (DECISIONS.md 0.1). SDL_VIDEO_DRIVER=dummy is set per job:
  # gpu-tests runs under a real (Xvfb) display on Linux instead.
  SDL_AUDIO_DRIVER: dummy
  SDL_JOYSTICK_ALLOW_BACKGROUND_EVENTS: "1"
  # Exact toolchain from versions.toml [toolchain]; bump it there and in the
  # dtolnay/rust-toolchain@<version> lines together (DECISIONS.md "Orchestrator — 1.2 review B1").
  RUST_VERSION: "1.97.0"

jobs:
  # Docs-only PRs skip the heavy jobs below. Skipping is done with a job-level `if:` (a skipped
  # job reports success, so required checks stay satisfied), not `paths-ignore` on the triggers
  # (which would leave required checks pending). Docs files are `**/*.md` and `.coderabbit.yaml`;
  # docs/SPEC.md counts as code because crates/pin_core/tests/schema_fixtures.rs include_str!s it.
  # Pushes and workflow_dispatch always run everything (gpu, dof and aarch64 default to true). The diff is from the merge base
  # (three dots), so later changes on the base branch are not counted, and --no-renames lists
  # both the old and new path of a rename, so renaming a .rs file to .md still counts as code.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      code: ${{ steps.filter.outputs.code }}
      gpu: ${{ steps.filter.outputs.gpu }}
      dof: ${{ steps.filter.outputs.dof }}
      aarch64: ${{ steps.filter.outputs.aarch64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail closed: any doubt (diff failure, no merge base, empty list) runs the full CI.
          code=true
          gpu=true
          dof=true
          aarch64=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # -z: NUL-separated, unquoted paths (git quotes non-ASCII and special characters
            # otherwise, which would miss the globs below). Written to a file, not a variable,
            # so git's exit status can be checked and the NULs survive.
            list="$(mktemp)"
            if git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$list" && [ -s "$list" ]; then
              code=false
              gpu=false
              dof=false
              aarch64=false
              while IFS= read -r -d '' f; do
                case "$f" in
                  docs/SPEC.md) code=true ;;
                  *.md | .coderabbit.yaml) ;;
                  *) code=true ;;
                esac
                # GPU tests: render/app crates and shaders. DOF bridge: its own tree.
                case "$f" in
                  crates/pin_render/* | crates/pin_app/* | *.wgsl) gpu=true ;;
                esac
                case "$f" in
                  tools/dof_bridge/*) dof=true ;;
                esac
                # replay-hash-aarch64 (D9): what pin_sim and the seam test build from, the
                # fixture and its golden, the tables, the toolchain/lock files, this workflow
                # and the assert script.
                case "$f" in
                  crates/pin_core/* | crates/pin_physics/* | crates/pin_input/* | crates/pin_sim/* | \
                  crates/pin_script/* | crates/pin_assets/* | third_party/lua-src/* | tables/* | \
                  Cargo.toml | Cargo.lock | versions.toml | .github/workflows/ci.yml | \
                  scripts/ci/replay_hash_assert.sh) aarch64=true ;;
                esac
              done < "$list"
            else
              echo "::warning::could not list changed files (or none); running full CI"
            fi
            rm -f "$list"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "gpu=$gpu" >> "$GITHUB_OUTPUT"
          echo "dof=$dof" >> "$GITHUB_OUTPUT"
          echo "aarch64=$aarch64" >> "$GITHUB_OUTPUT"
          echo "code=$code gpu=$gpu dof=$dof aarch64=$aarch64"

  # GPU-free crates (PLAN.md §2.3 rule 3): pin_core, pin_physics, pin_input,
  # pin_script, pin_assets, pin_tablegen, pin_sim (+ pin_assetgen, a GPU-free tool).
  core-tests:
    name: core-tests (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # No SDL/X11/audio packages here on purpose: the GPU-free crates must build
      # and test without display or GPU (PLAN.md §2.3 rule 3); only pin_app uses sdl3.

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::host $host, expected ${{ matrix.target }}"; exit 1
          fi

      - name: cargo test (GPU-free crates)
        run: cargo test --workspace --exclude pin_render --exclude pin_audio --exclude pin_app

      - name: cargo clippy -D warnings (tests/spec_ci)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path tests/spec_ci/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (tests/spec_ci workflow conformance)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path tests/spec_ci/Cargo.toml


  core-tests-cross:
    name: core-tests (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # No SDL/X11/audio packages here on purpose: the GPU-free crates must build
      # and test without display or GPU (PLAN.md §2.3 rule 3); only pin_app uses sdl3.

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::host $host, expected ${{ matrix.target }}"; exit 1
          fi

      - name: cargo test (GPU-free crates)
        run: cargo test --workspace --exclude pin_render --exclude pin_audio --exclude pin_app


  # GPU/audio/app crates on each OS's software or OS adapter:
  # lavapipe (Vulkan) on Linux, WARP (DX12) on Windows, Metal on macOS.
  gpu-tests:
    name: gpu-tests (${{ matrix.target }}, ${{ matrix.adapter }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.gpu == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            adapter: lavapipe
            wgpu_backend: vulkan
    env:
      # Not read by anything yet: from Subphase 1.4, pin_render's gpu-tests are expected to
      # build their wgpu Instance with InstanceDescriptor::with_env() (honouring WGPU_BACKEND)
      # and to treat a missing lavapipe/WARP/Metal adapter as a failure when PIN_REQUIRE_GPU=1
      # (the counterpart of SPIKE_REQUIRE_GPU in spikes.yml).
      WGPU_BACKEND: ${{ matrix.wgpu_backend }}
      PIN_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v5

      # PR #200: the rust-cache post step (cache save) ran out of disk after a from-scratch
      # build of the pin_app test binaries. Remove preinstalled toolchains this job never uses.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          df -h /

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packages (lavapipe, Xvfb, SDL3 build headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb xauth cmake \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libasound2-dev libpulse-dev

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::host $host, expected ${{ matrix.target }}"; exit 1
          fi

      # pin_render's adapter-dependent tests are behind its `gpu-tests` feature (Subphase 1.4).
      - name: cargo test (GPU crates, Linux under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p pin_render --features gpu-tests -p pin_audio -p pin_app

      - name: Disk usage after tests (Linux)
        if: runner.os == 'Linux' && always()
        run: df -h /

      - name: cargo test (GPU crates)
        if: runner.os != 'Linux'
        run: cargo test -p pin_render --features gpu-tests -p pin_audio -p pin_app


  gpu-tests-cross:
    name: gpu-tests (${{ matrix.target }}, ${{ matrix.adapter }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            adapter: WARP
            wgpu_backend: dx12
          - os: macos-latest
            target: aarch64-apple-darwin
            adapter: Metal
            wgpu_backend: metal
    env:
      # Not read by anything yet: from Subphase 1.4, pin_render's gpu-tests are expected to
      # build their wgpu Instance with InstanceDescriptor::with_env() (honouring WGPU_BACKEND)
      # and to treat a missing lavapipe/WARP/Metal adapter as a failure when PIN_REQUIRE_GPU=1
      # (the counterpart of SPIKE_REQUIRE_GPU in spikes.yml).
      WGPU_BACKEND: ${{ matrix.wgpu_backend }}
      PIN_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::host $host, expected ${{ matrix.target }}"; exit 1
          fi

      # pin_render's adapter-dependent tests are behind its `gpu-tests` feature (Subphase 1.4).
      - name: cargo test (GPU crates)
        if: runner.os != 'Linux'
        run: cargo test -p pin_render --features gpu-tests -p pin_audio -p pin_app

  clippy:
    name: clippy (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packages (SDL3 build headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libasound2-dev libpulse-dev

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::host $host, expected ${{ matrix.target }}"; exit 1
          fi

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings


  clippy-cross:
    name: clippy (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::host $host, expected ${{ matrix.target }}"; exit 1
          fi

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo fmt --check (tests/spec_ci)
        run: cargo fmt --manifest-path tests/spec_ci/Cargo.toml --all --check

  # Subphase 2.5 / KP-069: replay-hash gate (D9, SPEC §2.4; PROCESS R3). On each leg: build
  # pin_sim in release and run scripts/ci/replay_hash_assert.sh, which records the in-repo
  # fixture for 10 000 ticks, replays it 10 times, and fails on any in-machine mismatch AND
  # unless the recorded state_hash equals the committed x86_64-linux golden
  # (crates/pin_sim/tests/fixtures/replay_table.golden). The 2.2-S seam digests must equal the
  # test's EXPECTED (the test asserts them on x86_64 Linux and aarch64; the CI-side check of the
  # printed lines asserts them everywhere, including Windows). Only the reference set is gated
  # (x86_64 Linux, aarch64, Windows x86_64); other cross-OS values (soak.yml) stay report-only,
  # and no job compares one leg's output with another's: every leg compares with the golden.
  replay-hash:
    name: replay-hash (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      SDL_VIDEO_DRIVER: dummy
      FIXTURE: crates/pin_sim/tests/fixtures/replay_table
      TICKS: "10000"
      REPLAY_HASH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi

      - name: cargo build --release (pin_sim)
        run: cargo build --release -p pin_sim --bin pin_sim

      - name: replay-hash ${{ matrix.target }} (record, replay 10 times, assert the golden)
        shell: bash
        run: bash scripts/ci/replay_hash_assert.sh target/release/pin_sim

      - name: seam digests ${{ matrix.target }} (assert EXPECTED)
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          cargo test --release -p pin_physics --test ball_seam_bitident -- --nocapture 2>&1 | tee "$log"
          bash scripts/ci/replay_hash_assert.sh --seam-digests "$log"

  # D9 reference set, aarch64 (KP-069): pin_sim and the seam test cross-built for
  # aarch64-unknown-linux-gnu and run under qemu-user on the Linux runner, on every pull request
  # that touches the simulation (the `aarch64` output of `changes`) and every push to main. Gates:
  # the fixture's state_hash equals the committed x86_64-linux golden (and replays 10 times
  # unchanged), and ball_seam_bitident asserts its x86_64-linux EXPECTED digests. Aggregated by
  # pr-checks. Emulated run about 15 s plus 5 s; the cross build is about 2-4 min warm, 8-12 cold.
  # Only the C toolchain is cross-installed: pin_sim and pin_physics do not link SDL3.
  replay-hash-aarch64:
    name: replay-hash (aarch64-unknown-linux-gnu, qemu-user)
    needs: changes
    if: needs.changes.outputs.aarch64 == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEO_DRIVER: dummy
      FIXTURE: crates/pin_sim/tests/fixtures/replay_table
      TICKS: "10000"
      REPLAY_HASH_TARGET: aarch64-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu-qemu

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, target aarch64-unknown-linux-gnu)
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi
          if ! rustup target list --installed | grep -qx aarch64-unknown-linux-gnu; then
            echo "::error::target aarch64-unknown-linux-gnu not installed"; exit 1
          fi

      - name: Install qemu-user and the aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: cargo build --release --target aarch64-unknown-linux-gnu (pin_sim)
        run: cargo build --release --target aarch64-unknown-linux-gnu -p pin_sim --bin pin_sim

      - name: replay-hash aarch64-unknown-linux-gnu under qemu (record, replay 10 times, assert the golden)
        shell: bash
        run: bash scripts/ci/replay_hash_assert.sh target/aarch64-unknown-linux-gnu/release/pin_sim "qemu-aarch64 -L /usr/aarch64-linux-gnu"

      - name: seam digests aarch64-unknown-linux-gnu under qemu (assert EXPECTED)
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          cargo test --release --target aarch64-unknown-linux-gnu -p pin_physics --test ball_seam_bitident -- --nocapture 2>&1 | tee "$log"
          bash scripts/ci/replay_hash_assert.sh --seam-digests "$log"


  # The Windows and macOS legs of the replay-hash gate (D9), on push to main and dispatch (D40):
  # the same assert script, so Windows x86_64 and macOS arm64 must reproduce the committed
  # x86_64-linux golden and the seam test's EXPECTED digests (macOS arm64: the test asserts them
  # itself; Windows: the CI-side check of the printed `[seam digest]` lines).
  replay-hash-cross:
    name: replay-hash (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      SDL_VIDEO_DRIVER: dummy
      FIXTURE: crates/pin_sim/tests/fixtures/replay_table
      TICKS: "10000"
      REPLAY_HASH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (rustc ${{ env.RUST_VERSION }}, host ${{ matrix.target }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi

      - name: cargo build --release (pin_sim)
        run: cargo build --release -p pin_sim --bin pin_sim

      - name: replay-hash ${{ matrix.target }} (record, replay 10 times, assert the golden)
        shell: bash
        run: bash scripts/ci/replay_hash_assert.sh target/release/pin_sim

      - name: seam digests ${{ matrix.target }} (assert EXPECTED)
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          cargo test --release -p pin_physics --test ball_seam_bitident -- --nocapture 2>&1 | tee "$log"
          bash scripts/ci/replay_hash_assert.sh --seam-digests "$log"

  # Gate A1 runner (PLAN Gate A1): analytic and rig tests plus the 1,000-game soak at novice,
  # standard and expert, judged by `pin_sim soak --gate a1`. Manual only: the soak plays about
  # 4.4 games/s on one thread in release (measured: 50 games in 11.3 s), so 3 x 1,000 games take
  # roughly 11-12 minutes of soak plus the release build (about 6 minutes cold), well beyond what
  # every push should pay. The push-time `core-tests` job already runs the analytic and rig tests.
  # Run it from the Actions tab (workflow_dispatch); a failing criterion fails the job.
  # Timeout 45 min, the repository-wide job limit (tests/spec_ci): about 12 min of soak, 6 min of
  # cold release build and the rig tests fit with room to spare.
  gate-a1:
    name: gate-a1 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (rustc ${{ env.RUST_VERSION }})
        shell: bash
        run: |
          rustc -vV && cargo --version
          version=$(rustc --version | awk '{print $2}')
          if [ "$version" != "$RUST_VERSION" ]; then
            echo "::error::rustc $version, expected exactly $RUST_VERSION"; exit 1
          fi

      - name: Install Linux packages (SDL3 build headers for pin_app)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb xauth cmake \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libasound2-dev libpulse-dev

      - name: Gate A1 (scripts/gate_a1.sh)
        shell: bash
        run: scripts/gate_a1.sh

      - name: Upload the soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-a1-soak-reports
          path: target/gate_a1/soak_*/
          if-no-files-found: warn

  # Line coverage for the GPU-free crates (gate step 4). Non-gating for now: prints the table.
  # Like core-tests, no SDL/X11 packages are installed.
  coverage:
    name: coverage (core crates, non-gating)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (summary)
        run: |
          cargo llvm-cov --summary-only \
            -p pin_core -p pin_physics -p pin_input -p pin_script \
            -p pin_assets -p pin_tablegen -p pin_sim

  # Subphase 3.5: the DOF bridge (tools/dof_bridge, .NET 8), a Windows-only companion
  # process. Builds it and runs every test project under tools/dof_bridge/tests/ (Implementer
  # and Spec*), which replay the recorded telemetry fixtures into the bridge with a mock DOF
  # sink. No Rust here; it only waits for `changes`, so other jobs and platforms are unaffected.
  dof-bridge:
    name: dof-bridge (windows-latest, .NET 8)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.dof == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet build (bridge executable)
        shell: bash
        run: dotnet build tools/dof_bridge/src/KilohertzDofBridge/KilohertzDofBridge.csproj -c Release

      - name: dotnet test (every tools/dof_bridge/tests/*/*.csproj, coverlet)
        shell: bash
        run: |
          set -e
          for p in tools/dof_bridge/tests/*/*.csproj; do
            echo "::group::$p"
            dotnet test "$p" -c Release --collect:"XPlat Code Coverage" --results-directory tools/dof_bridge/TestResults --logger "console;verbosity=normal"
            echo "::endgroup::"
          done

      - name: .NET line coverage (report only)
        shell: bash
        run: |
          find tools/dof_bridge/TestResults -name coverage.cobertura.xml | while read -r f; do
            rate=$(sed -n 's/.*<coverage line-rate="\([0-9.]*\)".*/\1/p' "$f" | head -n 1)
            echo "::notice title=dof-bridge coverage::$f line-rate $rate"
          done

  # The single required status check for the `main` ruleset (PLAN §2.7 step 5, D40). A matrix job
  # skipped by its job-level `if` is reported under its unexpanded name
  # (`gpu-tests (${{ matrix.target }}, ...)`), so requiring the real names would stay pending on
  # PRs that skip them; and a skipped dependent of a failed `changes` reads as success. This job
  # always runs, requires `changes` to succeed, and fails on any needed job that failed or was
  # cancelled (success and skipped both pass). replay-hash-aarch64 is in the set (skipped on PRs
  # that do not touch the simulation). The `*-cross` jobs, coverage and gate-a1 are not part of
  # the PR set and are not aggregated.
  pr-checks:
    needs:
      - changes
      - fmt
      - clippy
      - core-tests
      - replay-hash
      - replay-hash-aarch64
      - gpu-tests
      - dof-bridge
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate the PR checks
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != "success" ]; then
            echo "::error::changes did not succeed"
            exit 1
          fi
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi

# Crate-local ban on std (platform libm) transcendentals: PLAN 2.4 / D9.
# Scope: pin_assets, pin_core, pin_physics, pin_sim, pin_input, pin_script, pin_tablegen,
# pin_assetgen (each has an identical copy of this list); presentation-only crates are exempt.
# KP-067 (#161): the same crates also ban std f32/f64 min/max (use pin_core::fmath; std zero ties
# and NaN results differ per target, D9 / REQ-WEB-002); glam crates also ban SIMD-backed glam types,
# glam Quat methods (use pin_physics::quat_ops) and glam vector min/max/clamp (scalar std min/max).
# See docs/decisions/2026-11-19-w8f-q5.md and docs/decisions/2026-11-19-w8g-e.md.
disallowed-methods = [
    { path = "f32::sin", reason = "use libm::sinf (PLAN 2.4, D9)" },
    { path = "f32::cos", reason = "use libm::cosf (PLAN 2.4, D9)" },
    { path = "f32::tan", reason = "use libm::tanf (PLAN 2.4, D9)" },
    { path = "f32::asin", reason = "use libm::asinf (PLAN 2.4, D9)" },
    { path = "f32::acos", reason = "use libm::acosf (PLAN 2.4, D9)" },
    { path = "f32::atan", reason = "use libm::atanf (PLAN 2.4, D9)" },
    { path = "f32::atan2", reason = "use libm::atan2f (PLAN 2.4, D9)" },

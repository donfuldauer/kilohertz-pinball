    { path = "f32::cosh", reason = "use libm::coshf (PLAN 2.4, D9)" },
    { path = "f32::tanh", reason = "use libm::tanhf (PLAN 2.4, D9)" },
    { path = "f32::asinh", reason = "use libm::asinhf (PLAN 2.4, D9)" },
    { path = "f32::acosh", reason = "use libm::acoshf (PLAN 2.4, D9)" },
    { path = "f32::atanh", reason = "use libm::atanhf (PLAN 2.4, D9)" },

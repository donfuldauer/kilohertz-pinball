[package]
name = "pin_render"
description = "Rendering: display topology, wgpu context, PBR, reflections, post and displays."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Enables the tests that need a GPU adapter (PLAN §2.3 rule 3, D20). Without an
# adapter they skip with a printed note unless PIN_REQUIRE_GPU=1.
gpu-tests = []

[dependencies]
pin_core.workspace = true
arrayvec.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
# Lamp warm-up curves (5.1): platform-independent exp.
libm.workspace = true
# Menu overlay painter (4.4).
egui.workspace = true
egui-wgpu.workspace = true

[dev-dependencies]
proptest.workspace = true
# WGSL validation and SPIR-V / MSL / HLSL translation of the PBR shaders (5.1).
naga.workspace = true
# PNG regression snapshots of the PBR golden images (5.1).
image.workspace = true
# Real windows for the surface smoke test (tests/gpu_window.rs).
sdl3.workspace = true

# Real SDL windows + surfaces (gpu-tests only). SDL video must run on the main
# thread (Cocoa), so a plain `main`. Skips without a native video driver unless
# PIN_REQUIRE_GPU=1.
[[test]]
name = "gpu_window"
harness = false
required-features = ["gpu-tests"]

[[test]]
name = "gpu_context_concurrency"
required-features = ["gpu-tests"]

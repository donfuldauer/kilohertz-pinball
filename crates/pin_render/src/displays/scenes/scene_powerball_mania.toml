# Placeholder mode-start scene for the A.1 example's "powerball_mania" mode
# (5.3). The title slides in, "MANIA" flashes, bars blink top and bottom.
schema_version = 1
duration_ms = 3000
background = "#000000"

[[layers]]
kind = "rect"
x = 0.0
y = 0.0
w = 1.0
h = 0.07
color = "#ff8000"
blink_ms = 100

[[layers]]
kind = "rect"
x = 0.0
y = 1.0
valign = "bottom"
w = 1.0
h = 0.07
color = "#ff8000"
blink_ms = 100

[[layers]]
kind = "text"
text = "POWERBALL"
x = 0.5
y = 0.34
size = 0.5
color = "#40c0ff"
from = [1.6, 0.34]
move_ms = 400

[[layers]]
kind = "text"
text = "MANIA"
x = 0.5
y = 0.76
size = 0.3
color = "#ffff40"
start_ms = 400
blink_ms = 150
fade_out_ms = 400

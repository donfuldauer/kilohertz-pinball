closed = false
material = "wood"

# A catch wall below the drain, so a drained ball reaches the trough switch.
[[walls]]
points = [[60.0, 0.0], [454.0, 0.0]]
closed = false
material = "wood"

[[posts]]
position = [140.0, 760.0]
radius = 8.0
rubber = true

[[posts]]

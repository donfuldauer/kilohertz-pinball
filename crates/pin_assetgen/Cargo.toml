[package]
name = "pin_assetgen"
description = "Code-generated, licence-clean placeholder sounds, fonts and art."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pin_assetgen"
path = "src/main.rs"

[dependencies]
pin_core.workspace = true
hound.workspace = true
libm.workspace = true
flate2.workspace = true
crc32fast.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Verification 4.6/1: outputs load through 4.1 (load_table, PNG decoding) and
# 3.3 (pin_audio's WAV decoder).
pin_assets = { path = "../pin_assets" }
pin_audio = { path = "../pin_audio" }
image.workspace = true
proptest.workspace = true

[package]
name = "pin_assets"
description = "Bundle VFS, zip hardening, glTF loader and manifest validation."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pin_core.workspace = true
pin_physics = { path = "../pin_physics" }
zip.workspace = true
glam.workspace = true
serde.workspace = true
serde_json = "=1.0.151"
# Default features off: no `import` (it reads the real filesystem); buffers and
# images are resolved through the VFS by this crate.
gltf = { version = "=1.4.1", default-features = false, features = ["names", "extras", "utils"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
proptest.workspace = true

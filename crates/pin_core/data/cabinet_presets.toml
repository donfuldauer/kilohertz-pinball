thread_diameter = 9.5
extension = 0.0                    # E, fully in
extension_min = 0.0                # E
extension_max = 44.0               # E
foot_shape = "domed"
foot_diameter = 38.0

[presets.classic_standard.mount]
offset_x = 0.0
inset = 30.0
height = 220.0
pitch_deg = 6.5                    # E, level legs give the listed pitch
roll_deg = 0.0                     # E, level side to side

[presets.classic_standard.glass_panel]
width = 533.0                      # E
length = 1092.0                    # E
thickness = 4.8                    # E

[presets.classic_standard.backbox]
width = 730.0                      # E
height = 730.0                     # E
depth = 250.0                      # E
front_y = 1065.0                   # rear face flush with the body rear
bottom_z = 710.0
front_profile = "flat"
top_profile = "flat"
speaker_panel_height = 200.0
grilles = [
    { u = -262.5, v = 100.0, diameter = 150.0 },
    { u = 262.5, v = 100.0, diameter = 150.0 },
]

[presets.classic_standard.backbox.backglass]
width = 686.0                      # E
height = 479.0                     # E
thickness = 3.2

[presets.classic_standard.backbox.translite_opening]
width = 656.0                      # E
height = 449.0                     # E
bottom = 215.0

[presets.classic_standard.backbox.score_display]
kind = "dmd"                       # E
pixels = [128, 32]                 # E
width = 320.0                      # E
height = 80.0                      # E
centre_v = 100.0

[presets.classic_standard.controls]
left_flipper_button = [-280.0, 130.0, 370.0]
right_flipper_button = [280.0, 130.0, 370.0]
start_button = [-200.0, 0.0, 340.0]
action_button = [0.0, 15.0, 420.0]
plunger = [230.0, 0.0, 235.0]

[presets.classic_standard.controls.coin_door]
centre = [0.0, 0.0, 190.0]
width = 300.0
height = 330.0

[presets.classic_standard.trim]
metal_finish = "chrome"
rail_colour = "#c0c0c0"


# Cabinet presets shipped with the engine (SPEC Appendix E, REQ-CAB-004; schema SPEC Appendix A.4).
#
# Each [presets.<id>] has the shape of a cabinet.toml and gives every field. Units: mm and
# degrees. Values from the Appendix E table are marked "E"; the rest are design values
# (docs/DECISIONS.md "#89 — Cabinet preset design values"), the same in every preset unless
# Appendix E makes them differ. Heights "above the floor" in Appendix E are with the levelers
# fully in and come out of: body bottom = leg length + leveler extension - body.leg_overlap.
#
#   floor to lockdown bar top = body bottom + body.front_height + body.lockdown_bar.height
#   floor to backbox top      = body bottom + backbox.bottom_z + backbox.height
#   flipper button centre     = body bottom + controls.*_flipper_button[2]
#
# classic: body bottom 724 + 0 - 234 = 490; 490 + 400 + 20 = 910 (E); 490 + 710 + 730 = 1930 (E);
#          490 + 370 = 860 (E).
# modern:  body bottom 778 + 25 - 322 = 481; 481 + 413 + 20 = 914 (E); 481 + 719 + 711 = 1911 (E);
#          481 + 383 = 864 (E).

schema_version = 1

# ---------------------------------------------------------------------------------------------
[presets.classic_standard.body]
width = 560.0                      # E
length = 1315.0                    # E, plunger excluded
front_height = 400.0               # E
rear_height = 605.0                # E
wall_thickness = 19.0
leg_overlap = 234.0

[presets.classic_standard.body.glass_channel]
width = 6.5
depth = 8.0

[presets.classic_standard.body.lockdown_bar]
profile = "rounded"
height = 20.0
depth = 64.0

[presets.classic_standard.body.side_rail]
profile = "rounded"
width = 25.0
height = 15.0

[presets.classic_standard.legs.default]
length = 724.0                     # E
material = "steel"
finish = "chrome"                  # E
surface = "ribbed"                 # E
colour = "#d8d8d8"
bracket = "corner_plate"
bolt = "hex"
corner_inset = [38.0, 38.0]

[presets.classic_standard.legs.default.section]
shape = "tapered"
top = 76.0
bottom = 57.0

[presets.classic_standard.legs.default.leveler]

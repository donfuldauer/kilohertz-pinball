# Built-in material library shipped with the engine (SPEC Appendix A.5, REQ-BUILD-004).
#
# Each [[materials]] entry names how a part looks (render parameters, Subphase 5.1) and, for
# a part the ball can touch, how it plays: `physical` is a material of the Appendix C
# material-pair table. Colours are sRGB "#rrggbb". A table's [[materials]] entry with the same
# id replaces an entry here whole.
#
# The seven physical names come first; each plays as itself, so `material = "wood"` in a
# layout.toml means exactly what it meant before this library existed. Their colours,
# metallic, roughness and alpha are the generator's flat placeholder materials converted to
# sRGB.

schema_version = 1

# --- the seven physical materials -----------------------------------------------------------

[[materials]]
id = "steel"
base_color = "#ceced1"
metallic = 1.0
roughness = 0.25
physical = "steel"

[[materials]]
id = "ceramic"
base_color = "#f3f3f1"
roughness = 0.2
physical = "ceramic"

[[materials]]
id = "plastic"
base_color = "#e7e7e7"
roughness = 0.4
physical = "plastic"

[[materials]]
id = "resin"
base_color = "#b37c45"
roughness = 0.35
physical = "resin"

[[materials]]
id = "rubber"
base_color = "#272727"
roughness = 0.9
physical = "rubber"

[[materials]]

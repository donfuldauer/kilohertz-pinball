# Built-in part styles and rubber-ring sizes shipped with the engine (SPEC Appendix A.5,
# REQ-BUILD-003). Units: mm.
#
# Every kind has a default style whose id is the kind's name and which has no `base`; every
# other style of that kind starts from it. A table's [[part_styles]] entry with the same id
# overrides a style here field by field.
#
# The defaults reproduce what the table generator does today (docs/DECISIONS.md "#90 KP-010 —
# Built-in library and style names"): posts, walls and lane guides leave `height` unset, which
# means the playfield's `wall_height`; post material `steel` (a layout post with
# `rubber = true` plays as `rubber`, its own key wins); lane guides and wireforms `steel`, a
# wireform tube 1.5 mm in radius with 8 sides; walls `wood` and decks `acrylic` (a layout
# wall's or deck's own `material` wins); inserts 0.1 mm above the surface. Other numbers are
# design values.

schema_version = 1

# --- rubber-ring sizes: inner diameter and cross-section, mm ----------------------------------

[[ring_sizes]]
id = "ring_8"
inner_diameter = 8.0
section = 3.2

[[ring_sizes]]
